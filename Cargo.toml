[package]
name = "rootyard"
default-run = "rootyard"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Single-node Git hosting with PostgreSQL metadata and native Git storage"
# Lowest Rust that can build this crate: edition 2024 let-chains are already
# used in storage/sharding/workspace code, and dependencies declare at most
# 1.85. The accepted gate toolchain is 1.99.1 (rust-toolchain.toml); see
# docs/development.md for both versions and the reason they differ.
rust-version = "1.88"

[features]
default = ["kafka-wake"]
# Transitional full profile; --no-default-features builds the Blob standalone without librdkafka.
kafka-wake = ["dep:rdkafka"]
pando-lab = []
# Optional Azure Blob provider for the standalone OpenDAL Blob profile.
# S3 is always compiled; no fs/memory service is enabled for this profile.
blob-azblob = ["opendal/services-azblob"]

[[bin]]
name = "rootyard-pando-lab"
path = "src/bin/rootyard-pando-lab.rs"
required-features = ["pando-lab"]

[[bin]]
name = "rootyard-vfs-mount"
path = "src/bin/rootyard-vfs-mount.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
deadpool-postgres = "0.14"
fs2 = "0.4"
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
futures-util = "0.3"
# Apache OpenDAL owns provider signing, TLS, multipart/abort, retry, timeout and
# concurrency layers. Pinned exactly; default features stay off so no fs/memory
# or tracing/metrics stack is pulled into the minimal profile.
opendal = { version = "=0.57.0", default-features = false, features = ["services-s3", "reqwest-rustls-no-provider-tls", "executors-tokio", "layers-concurrent-limit", "layers-retry", "layers-timeout"] }
# Pinned Apache upstream S3 error parser, patched to the exact vendored crate.
# The local shim adds only `parse_error_response`; protocol code is untouched.
opendal-service-s3 = { version = "=0.57.0", default-features = false }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rdkafka = { version = "0.39", optional = true, default-features = false, features = ["tokio", "ssl"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
# Test-only: the in-process `memory` service backs IO lifecycle unit tests
# (`cfg(test)` constructors only). Production keeps the strict remote profile and
# never compiles or accepts `memory`; features are additive, no extra crate is
# pulled in and the lockfile is unchanged.
opendal = { version = "=0.57.0", default-features = false, features = ["services-memory"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Root-authorized bounded vendor: exact crates.io opendal-service-s3 0.57.0
# plus one documented public shim around the existing private error parser.
# Provenance and checksums live in vendor/opendal-service-s3/README.vendor.md.
# Cargo.lock is owned and regenerated by the repository root, not by workers.
[patch.crates-io]
opendal-service-s3 = { path = "vendor/opendal-service-s3" }
