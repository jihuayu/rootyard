[package]
name = "rootyard"
default-run = "rootyard"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Single-node Git hosting with PostgreSQL metadata and native Git storage"
rust-version = "1.85"

[features]
pando-lab = []

[[bin]]
name = "rootyard-pando-lab"
path = "src/bin/rootyard-pando-lab.rs"
required-features = ["pando-lab"]

[[bin]]
name = "rootyard-vfs-mount"
path = "src/bin/rootyard-vfs-mount.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
deadpool-postgres = "0.14"
fs2 = "0.4"
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rand = "0.9"
rdkafka = { version = "0.39", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
