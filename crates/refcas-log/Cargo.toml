[workspace]

[package]
name = "rootyard-refcas-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
openraft = { version = "=0.9.26", features = ["serde", "storage-v2"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
fs2 = "=0.4.3"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.15.1"
x509-cert = "=0.2.5"

[dev-dependencies]
tempfile = "=3.27.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.dev]
debug = 1
