# Local development only: HTTP is reachable only from this host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rootyard
      POSTGRES_DB: rootyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootyard -d rootyard"]
      interval: 3s
      timeout: 3s
      retries: 20
  rootyard:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use a generated hexadecimal password; other characters may need URL encoding.
      DATABASE_URL: postgresql://rootyard:${POSTGRES_PASSWORD}@postgres:5432/rootyard
      ROOTYARD_DATA_DIR: /var/lib/rootyard
      ROOTYARD_BIND: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - git-data:/var/lib/rootyard
    init: true
    stop_grace_period: 30s
volumes:
  postgres-data:
  git-data:
