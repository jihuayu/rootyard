name: Pando OID range-read research evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/pando-range-read-eval.yml'
      - 'scripts/pando_range_read_eval.py'
      - 'scripts/pando_range_eval/**'
      - 'tests/test_pando_range_read_eval.py'
      - 'docs/pando-oid-range-read-research.md'
      - 'scripts/owned_garage_fixture.sh'
      - 'scripts/owned_object_store_env.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pando-range-read-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  range-read-eval:
    name: Pando OID Range Read Eval
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify stock Git, design docs, and #179 unit & workflow contracts
        run: |
          set -euo pipefail
          git --version
          python3 scripts/check_design_docs.py
          python3 -m unittest -v \
            tests.test_ci_workflow_triggers \
            tests.test_ci_cargo_fork_workflows \
            tests.test_pando_range_read_eval

      - name: Start job-owned Garage 2.1 S3 fixture
        timeout-minutes: 10
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          mkdir -p "$RUNNER_TEMP/owned-garage"
          echo "OBJECT_STORE_ENV_FILE=$RUNNER_TEMP/owned-garage/object-store.env" >>"$GITHUB_ENV"
          scripts/owned_garage_fixture.sh start \
            --directory "$RUNNER_TEMP/owned-garage/fixture" \
            --output-env "$RUNNER_TEMP/owned-garage/object-store.env" \
            --bucket-prefix rootyard-ci \
            --region garage

      - name: Run full #179 OID range-read evaluation against loopback HTTP and Garage S3
        run: |
          set -euo pipefail
          mkdir -p test-results/pando-range-read
          python3 scripts/pando_range_read_eval.py \
            --scale full \
            --simulated-rtt-ms 1.5 \
            --s3-env "$OBJECT_STORE_ENV_FILE" \
            --require-s3 \
            --output test-results/pando-range-read/report.json \
            --markdown-out test-results/pando-range-read/summary.md
          cat test-results/pando-range-read/summary.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("test-results/pando-range-read/report.json").read_text(encoding="utf-8"))
          assert data["garage_s3_range_probe"]["range_status"] == 206
          assert data["garage_s3_range_probe"]["wrong_if_match_status"] == 412
          assert len(data["adversarial"]["sha1"]) == 12
          assert len(data["adversarial"]["sha256"]) == 12
          PY

      - name: Stop job-owned Garage S3 fixture
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${OBJECT_STORE_ENV_FILE:-}" ]; then
            rm -f -- "$OBJECT_STORE_ENV_FILE"
          fi
          if [ -n "${RUNNER_TEMP:-}" ]; then
            scripts/owned_garage_fixture.sh stop --directory "$RUNNER_TEMP/owned-garage/fixture"
          fi

      - name: Upload #179 evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pando-range-read-eval-evidence
          path: test-results/pando-range-read/
          if-no-files-found: warn
