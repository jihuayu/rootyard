name: Pando synthetic lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql git
          PG_BIN=$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)
          echo "$PG_BIN" >> "$GITHUB_PATH"
          PG_VERSION=$(basename "$(dirname "$PG_BIN")")
          echo "PG_SHARE=/usr/share/postgresql/$PG_VERSION" >> "$GITHUB_ENV"
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record test-results/pando-lab-cargo-fork.json
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features pando-lab -- -D warnings
      - name: Cargo test (Pando lab, all targets)
        run: python3 scripts/run_pando_lab_cargo_test.py
      - name: Run synthetic Smart HTTP and publication tests
        run: ./scripts/test-pando-lab.sh
      - name: Preserve actual client and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pando-lab-evidence
          if-no-files-found: warn
          path: |
            test-results/pando-lab-cargo-fork.json
            /tmp/rootyard-pando-lab-*/results.json
            /tmp/rootyard-pando-lab-*/commands.json
            /tmp/rootyard-pando-lab-*/server-*.log
            /tmp/rootyard-pando-lab-*/postgres.log
            /tmp/rootyard-pando-lab-*/git-packets-*.log
            /tmp/rootyard-pando-lab-*/*.pack
            /tmp/rootyard-pando-lab-*/*.bin
