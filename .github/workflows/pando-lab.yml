name: Pando synthetic lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql git
          PG_BIN=$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)
          echo "$PG_BIN" >> "$GITHUB_PATH"
          PG_VERSION=$(basename "$(dirname "$PG_BIN")")
          echo "PG_SHARE=/usr/share/postgresql/$PG_VERSION" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features pando-lab -- -D warnings
      - run: cargo test --locked --all-targets --features pando-lab
      - name: Run synthetic Smart HTTP and publication tests
        run: ./scripts/test-pando-lab.sh
      - name: Preserve actual client and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pando-lab-evidence
          if-no-files-found: warn
          path: |
            /tmp/rootyard-pando-lab-*/results.json
            /tmp/rootyard-pando-lab-*/commands.json
            /tmp/rootyard-pando-lab-*/server-*.log
            /tmp/rootyard-pando-lab-*/postgres.log
            /tmp/rootyard-pando-lab-*/git-packets-*.log
            /tmp/rootyard-pando-lab-*/*.pack
            /tmp/rootyard-pando-lab-*/*.bin
