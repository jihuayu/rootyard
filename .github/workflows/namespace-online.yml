name: Namespace online workflows

on:
  pull_request:
    paths:
      - '.github/workflows/namespace-online.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/namespace_service.rs'
      - 'src/namespace_service/**'
      - 'src/view_lab.rs'
      - 'src/view_lab/**'
      - 'docs/namespace-views.md'
      - 'tests/test_namespace_service.py'
      - 'tests/namespace_online_workflows.py'
      - 'tests/test_namespace_online_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-online-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  namespace-online:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_DB: rootyard_namespace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_namespace"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard@127.0.0.1:55432/rootyard_namespace
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline Namespace online contract checks
        run: python3 -m unittest -v tests.test_namespace_online_contracts
      - name: Install the reviewed native tool profile
        timeout-minutes: 20
        run: |
          scripts/install_ci_native_tools.sh install \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/namespace-online/native-tools.json
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verify the native tool profile
        timeout-minutes: 5
        run: |
          echo "PG_SHARE=/usr/share/postgresql/17" >> "$GITHUB_ENV"
          scripts/install_ci_native_tools.sh preflight \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/namespace-online/native-tools.json
      - name: Install pinned Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record test-results/namespace-online/cargo-fork.json
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '
      - name: Check formatting, clippy, and unit tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib namespace_service
      - name: Build sealed rootyard candidate and rootyard-view-lab
        timeout-minutes: 20
        run: |
          set -euo pipefail
          artifact_store="$HOME/.cache/rootyard/native-artifacts"
          candidate_dir="$RUNNER_TEMP/namespace-online-bin"
          mkdir -p "$candidate_dir" test-results
          python3 scripts/build_native.py \
            --features pando-lab \
            --artifact-store "$artifact_store" \
            --output "$candidate_dir/rootyard" \
            > test-results/namespace-online-build.json
          cargo build --locked --bin rootyard-view-lab
          echo "ROOTYARD_BIN=$candidate_dir/rootyard" >> "$GITHUB_ENV"
      - name: Run existing Namespace service regression suite
        timeout-minutes: 10
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
        run: python3 -m unittest -v tests.test_namespace_service
      - name: Run online Namespace, Smart HTTP View, RBAC, conflict, and crash recovery workflows
        timeout-minutes: 15
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
        run: |
          python3 tests/namespace_online_workflows.py \
            --binary "$ROOTYARD_BIN" \
            --report test-results/namespace-online-workflows.json
      - name: Upload namespace-online test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namespace-online-report
          if-no-files-found: warn
          path: |
            test-results/namespace-online-build.json
            test-results/namespace-online-workflows.json
            test-results/namespace-online/
