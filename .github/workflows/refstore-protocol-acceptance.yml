                      check(identity.get(field) == value,
                            label + ' receipt ' + tool + '.' + field + ' does not match the trusted CI pin')
              for field in ('target_triple', 'pinned_channel'):
                  check(actual.get(field) == expected[field],
                        label + ' receipt toolchain.' + field + ' does not match the trusted CI pin')

          def require_command(payload, expected, label, schema):
              command = payload.get('command')
              check(isinstance(command, list) and all(isinstance(item, str) for item in command),
                    label + ' receipt command is not a list of strings')
              if command == expected:
                  if schema == 'v2':
                      options = payload.get('build_options')
                      check(isinstance(options, dict),
                            label + ' v2 receipt has no build_options metadata')
                      check(options.get('jobs') is None,
                            label + ' v2 receipt omits a recorded positive jobs budget')
                  return
              if (schema == 'v2' and len(command) == len(expected) + 2
                      and command[:len(expected)] == expected and command[-2] == '--jobs'):
                  check(re.fullmatch(r'[1-9][0-9]*', command[-1]) is not None,
                        label + ' receipt has a non-positive or non-decimal --jobs budget')
                  jobs = int(command[-1])
                  options = payload.get('build_options')
                  check(isinstance(options, dict),
                        label + ' v2 receipt has no build_options metadata')
                  check(isinstance(options.get('jobs'), int)
                        and not isinstance(options.get('jobs'), bool)
                        and options.get('jobs') == jobs,
                        label + ' v2 receipt --jobs budget does not match build_options.jobs')
                  return
              fail(label + ' receipt command is ' + repr(command)
                   + ', expected exactly ' + repr(expected)
                   + ' with an optional explicit positive trailing --jobs budget')

          def artifacts_of(validated, label):
              entries = list(validated.artifacts)
              check(bool(entries), label + ' receipt has no selected artifacts')
              if validated.schema == 'v1':
                  for index, entry in enumerate(entries):
                      check(isinstance(entry, dict) and entry.get('fresh') is False,
                            label + ' fresh_false_artifacts[' + str(index) + '] is not fresh=false')
              else:
                  for index, entry in enumerate(entries):
                      check(isinstance(entry.get('fresh'), bool),
                            label + ' cargo_artifacts[' + str(index) + '] fresh is not a JSON boolean')
              return entries

          def require_v2_artifact_sources(validated, expected, label):
              # v2 rows are already hash- and inventory-bound by the shared
              # reader.  The caller adds the logical source path (and its file
              # hash) for each intended target/kind, without reimplementing the
              # shared source-closure algorithm.  v1 rows never carried a
              # source field, so historical receipts keep their existing checks.
              if validated.schema != 'v2':
                  return
              rows = list(validated.artifacts)
              check(len(rows) == len(expected),
                    label + ' receipt does not name exactly the expected v2 artifacts')
              by_key = {(row.get('target'), row.get('kind')): row for row in rows}
              check(len(by_key) == len(rows),
                    label + ' receipt repeats a v2 artifact target/kind')
              for target, kind, source in expected:
                  row = by_key.get((target, kind))
                  check(row is not None,
                        label + ' receipt lacks the ' + kind + '/' + target + ' artifact')
                  check(row.get('source') == source,
                        label + ' ' + kind + ' artifact source is not ' + source)
                  check(row.get('source_sha256') == sha256(workspace / source),
                        label + ' ' + kind + ' artifact source SHA does not match ' + source)

          record = toolchain_record()
          trusted = expected_toolchain(record)
          try:
              # Consume the raw bytes that are about to be validated.  The
              # receipt parser hashes the exact bytes it parsed; comparing that
              # hash with this pre-read proves the payload used below belongs to
              # those same bytes and did not change between reads.
              test_receipt_bytes = pathlib.Path(test_receipt_path).read_bytes()
              serving_receipt_bytes = pathlib.Path(serving_receipt_path).read_bytes()
              test_validated = receipts.load_receipt(
                  test_receipt_path, source_root=workspace, binary_path=test_binary,
                  expected_commit=head, verify_source_files=True)
              serving_validated = receipts.load_receipt(
                  serving_receipt_path, source_root=workspace, binary_path=serving_binary,
                  expected_commit=head, verify_source_files=True)
          except OSError as error:
              fail('unreadable receipt: ' + type(error).__name__)
          except receipts.ReceiptError as error:
              fail(str(error))

          check(test_validated.receipt_sha256 == sha256_bytes(test_receipt_bytes),
                'test receipt bytes changed between consumption and validation')
          check(serving_validated.receipt_sha256 == sha256_bytes(serving_receipt_bytes),
                'product receipt bytes changed between consumption and validation')
          test_receipt = test_validated.payload
          serving_receipt = serving_validated.payload
          check(test_validated.workspace_commit == head, 'test receipt workspace_commit differs from HEAD')
          check(serving_validated.workspace_commit == head, 'product receipt workspace_commit differs from HEAD')
          check(test_validated.schema == serving_validated.schema,
                'test and product receipts use different schemas')
          check(isinstance(test_receipt.get('source_inputs_sha256'), str)
                and test_receipt.get('source_inputs_sha256') == serving_receipt.get('source_inputs_sha256'),
                'test and product receipts disagree on source_inputs_sha256')
          if test_validated.schema == 'v1':
              check(test_receipt.get('fresh') is False, 'test receipt fresh is not false')
              check(test_receipt.get('package_rebuilt') is True, 'test receipt does not record a package rebuild')
              check(isinstance(test_receipt.get('rustc'), str)
                    and re.match(r'^rustc 1\.99\.1(?:\s|$)', test_receipt['rustc']) is not None,
                    'legacy test receipt rustc is not the trusted 1.99.1 pin')
              check(test_receipt.get('rustc') == serving_receipt.get('rustc'),
                    'legacy test and product receipts bind different rustc')
          else:
              check(test_validated.schema == 'v2', 'test receipt schema is not v1 or v2')
              check(test_receipt.get('receipt_schema') == receipts.RECEIPT_SCHEMA_V2,
                    'test receipt schema discriminator is not v2')
              check(test_receipt.get('profile') == 'test', 'test receipt top-level profile is not test')
              check(serving_receipt.get('profile') == 'dev', 'product receipt top-level profile is not dev')
              for label, payload in (('test', test_receipt), ('product', serving_receipt)):
                  features = payload.get('features')
                  check(isinstance(features, dict), label + ' receipt has no features metadata')
                  check(features.get('enabled') == EXPECTED_FEATURES['enabled'],
                        label + ' receipt enables unexpected features')
                  check(features.get('no_default_features') is EXPECTED_FEATURES['no_default_features'],
                        label + ' receipt does not record no_default_features=true')
              require_v2_toolchain(test_validated, trusted, 'test')
              require_v2_toolchain(serving_validated, trusted, 'product')
              for tool in ('cargo', 'rustc'):
                  check(test_validated.toolchain.get(tool) == serving_validated.toolchain.get(tool),
                        'test and product receipts bind different ' + tool + ' identities')

          require_command(test_receipt, EXPECTED_TEST_COMMAND, 'test', test_validated.schema)
          require_command(serving_receipt, EXPECTED_SERVING_COMMAND, 'product', serving_validated.schema)
          check(test_receipt.get('kind') == 'rust-integration-test', 'test receipt kind is not rust-integration-test')
          check(test_receipt.get('relocated_artifact') is True, 'test receipt does not describe a relocated artifact')
          check(test_receipt.get('integration_test_source_sha256') == sha256(test_source),
                'test receipt source SHA does not match ' + test_source)
          check(test_receipt.get('binary_sha256') == sha256(test_binary),
                'relocated test executable SHA-256 does not match its receipt')
          check(serving_receipt.get('binary_sha256') == sha256(serving_binary),
                'copied rootyard executable SHA-256 does not match its receipt')
          if 'original_artifact_sha256' in test_receipt:
              check(test_receipt.get('original_artifact_sha256') == sha256(test_binary),
                    'test receipt original artifact hash does not match the relocated executable')
          if 'original_artifact_sha256' in serving_receipt:
              check(serving_receipt.get('original_artifact_sha256') == sha256(serving_binary),
                    'product receipt original artifact hash does not match the supplied executable')

          closure_paths = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', test_source, 'tests/blob_gateway_support'],
              text=True).split('\0')
          closure_files = sorted(path for path in closure_paths if path)
          check(test_source in closure_files, 'tracked test source closure does not include ' + test_source)
          check(len(closure_files) == len(set(closure_files)),
                'tracked test source closure lists duplicate paths')
          check(all(pathlib.Path(path).is_file() for path in closure_files),
                'tracked test source closure lists files that do not exist')
          closure_digest = hashlib.sha256()
          for path in closure_files:
              file_sha = sha256(path)
              closure_digest.update(CLOSURE_LABEL)
              closure_digest.update(path.encode('utf-8') + b'\0')
              closure_digest.update(file_sha.encode('ascii') + b'\n')
          closure_sha256 = closure_digest.hexdigest()
          # Historical v1 receipts carry no integration-test/support closure
          # field (and v2 inventory is a different, schema-owned shape).  The
          # pre/post-build clean-worktree checks bind this tree to the receipt
          # workspace_commit, so recomputing the tracked closure here is the
          # legacy v1 proof; a receipt-supplied digest is never echoed and no
          # v1 field is invented.

          test_artifacts = artifacts_of(test_validated, 'test')
          selected = [entry for entry in test_artifacts
                      if entry.get('target') == 'blob_git_gateway' and entry.get('kind') == 'test']
          check(len(selected) == 1, 'test receipt does not name exactly one blob_git_gateway/test artifact')
          check(len(test_artifacts) == 1, 'test receipt names extra selected artifacts')
          if test_validated.schema == 'v2':
              selected_profile = selected[0].get('profile')
              check(isinstance(selected_profile, dict)
                    and selected_profile.get('test') is True
                    and selected_profile.get('debuginfo') == 0,
                    'test artifact is not the debug=0 test-profile executable')
          require_v2_artifact_sources(
              test_validated,
              [('blob_git_gateway', 'test', test_source)],
              'test receipt')
          serving_artifacts = artifacts_of(serving_validated, 'product')
          binaries = [entry for entry in serving_artifacts
                      if entry.get('target') == 'rootyard' and entry.get('kind') == 'bin']
          check(len(binaries) == 1, 'product receipt does not name exactly one rootyard/bin artifact')
          if serving_validated.schema == 'v2':
              check(sorted(entry.get('kind') for entry in serving_artifacts) == ['bin', 'lib'],
                    'product receipt does not name exactly the rootyard lib and bin artifacts')
              check(all(entry.get('target') == 'rootyard' for entry in serving_artifacts),
                    'product receipt names an artifact outside the rootyard package')
              binary_profile = binaries[0].get('profile')
              check(isinstance(binary_profile, dict)
                    and binary_profile.get('test') is False
                    and binary_profile.get('debuginfo') == 0,
                    'product bin artifact is not the debug=0 dev-profile executable')
          require_v2_artifact_sources(
              serving_validated,
              [('rootyard', 'lib', 'src/lib.rs'),
               ('rootyard', 'bin', 'src/main.rs')],
              'product receipt')

          def recorded_artifacts(validated, entries):
              record = {
                  'receipt_schema': validated.schema,
                  'receipt_path': str(validated.receipt_path),
                  'receipt_sha256': validated.receipt_sha256,
                  'cargo_artifacts': entries,
              }
              if validated.schema == 'v1':
                  record['fresh_false_artifacts'] = entries
                  if 'fresh' in validated.payload:
                      record['fresh'] = validated.payload['fresh']
              return record

          manifest = {
              'version': 1, 'issue': 126, 'test': 'blob_git_gateway',
              'workspace_commit': head,
              'source_inputs_sha256': test_receipt['source_inputs_sha256'],
              'test_source_closure': {'sha256': closure_sha256, 'files': closure_files},
              'toolchain': {
                  'cargo': {key: trusted['cargo'][key]
                            for key in ('release', 'commit_hash', 'host', 'executable_sha256')},
                  'rustc': {key: trusted['rustc'][key]
                            for key in ('release', 'commit_hash', 'host', 'version')},
              },
              'test_executable': {'name': 'blob-git-gateway', 'sha256': sha256(test_binary)},
              'serving_executable': {'name': 'rootyard', 'sha256': sha256(serving_binary)},
              'test_receipt': recorded_artifacts(test_validated, test_artifacts),
              'serving_receipt': recorded_artifacts(serving_validated, serving_artifacts),
          }
          pathlib.Path('test-results/refstore/blob_git_gateway/build-pair.json').write_text(
              json.dumps(manifest, indent=2) + '\n')
          PY
          # Pair verification passed; copy the raw receipts (kept in $pair) into the uploaded evidence directory.
          cp "$test_receipt" test-results/refstore/blob_git_gateway/blob-git-gateway.build.json
          cp "$serving_receipt" test-results/refstore/blob_git_gateway/rootyard.build.json
          python3 - <<'PY'
          import hashlib, json, pathlib

          directory = pathlib.Path('test-results/refstore/blob_git_gateway')
          manifest = json.loads((directory / 'build-pair.json').read_text())
          checked = {}
          for key, name in (('test_receipt', 'blob-git-gateway.build.json'),
                            ('serving_receipt', 'rootyard.build.json')):
              record = manifest.get(key)
              if not isinstance(record, dict):
                  raise SystemExit('build-pair receipt copy check failed: ' + key + ' is missing')
              anchored = record.get('receipt_sha256')
              if not isinstance(anchored, str) or len(anchored) != 64:
                  raise SystemExit('build-pair receipt copy check failed: ' + key + ' has no anchored SHA-256')
              copied = directory / name
              if not copied.is_file():
                  raise SystemExit('build-pair receipt copy check failed: ' + key + ' copy is missing')
              actual = hashlib.sha256(copied.read_bytes()).hexdigest()
              if actual != anchored:
                  raise SystemExit('build-pair receipt copy check failed: ' + key + ' bytes changed after verification')
              checked[key] = {'path': str(copied), 'sha256': actual}
          (directory / 'receipt-copy-check.json').write_text(
              json.dumps({'version': 1, 'issue': 126, 'checked': checked}, indent=2) + '\n')
          PY
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_BLOB_DRIVER=opendal ROOTYARD_BLOB_SERVICE=s3
          export ROOTYARD_BLOB_ENDPOINT="$ROOTYARD_OBJECT_STORE_ENDPOINT"
          export ROOTYARD_BLOB_BUCKET="$ROOTYARD_OBJECT_STORE_BUCKET"
          export ROOTYARD_BLOB_REGION="$ROOTYARD_OBJECT_STORE_REGION"
          export ROOTYARD_BLOB_ACCESS_KEY_ID="$ROOTYARD_OBJECT_STORE_ACCESS_KEY"
          export ROOTYARD_BLOB_SECRET_ACCESS_KEY="$ROOTYARD_OBJECT_STORE_SECRET_KEY"
          export ROOTYARD_BLOB_ROOT="blob-git-gateway-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export ROOTYARD_TEST_GIT="$(command -v git)"
          export ROOTYARD_SERVING_BINARY="$serving_binary"
          export CARGO_BIN_EXE_ROOTYARD="$serving_binary"
          report_dir=test-results/refstore/blob_git_gateway
          "$test_binary" --ignored --list > "$report_dir/ignored-inventory.txt" 2>&1
          python3 - "$report_dir/ignored-inventory.txt" <<'PY'
          import pathlib, re, sys

          listing = pathlib.Path(sys.argv[1]).read_text()
          names = re.findall(r'^([A-Za-z0-9_]+(?:::[A-Za-z0-9_]+)*): test$', listing, re.MULTILINE)
          expected = [
              'atomic_push_with_rewritten_old_oid_rejects_both_refs_and_leaves_gate_unchanged',
              'concurrent_same_tip_pushes_get_parsed_ng_stale_info',
              'lost_receive_pack_ack_after_commit_resolves_committed_via_operation_get',
              'smart_http_push_then_reclone_without_compute_views_has_exact_oid',
          ]
          if not names:
              raise SystemExit('ignored inventory check failed: no ignored tests were listed')
          if len(names) != len(set(names)):
              raise SystemExit('ignored inventory check failed: duplicate test names')
          if sorted(names) != sorted(expected):
              raise SystemExit('ignored inventory check failed: unexpected ' + repr(sorted(names)) +
                               '; expected exactly ' + repr(sorted(expected)))
          pathlib.Path(sys.argv[1]).with_name('ignored-inventory.json').write_text(
              __import__('json').dumps({'ok': True, 'ignored_tests': expected}, indent=2) + '\n')
          PY
          status=0
          "$test_binary" --ignored --test-threads=1 \
            --skip smart_http_push_then_reclone_without_compute_views_has_exact_oid \
            > "$report_dir/native.log" 2>&1 || status=$?
          python3 - "$report_dir/native.log" "$status" <<'PY'
          import hashlib, io, itertools, json, pathlib, re, sys

          native_log = pathlib.Path(sys.argv[1])
          outcome_path = native_log.with_name('native-outcome.json')
          status = sys.argv[2]
          targets = [
              'atomic_push_with_rewritten_old_oid_rejects_both_refs_and_leaves_gate_unchanged',
              'concurrent_same_tip_pushes_get_parsed_ng_stale_info',
              'lost_receive_pack_ack_after_commit_resolves_committed_via_operation_get',
          ]
          skipped = ['smart_http_push_then_reclone_without_compute_views_has_exact_oid']
          exit_code = int(status) if re.fullmatch(r'[0-9]{1,3}', status) else None
          if exit_code is not None and exit_code > 255:
              exit_code = None
          known_results = {' ok': 'ok', ' FAILED': 'failed', ' ignored': 'ignored'}

          def case_outcome(log, name):
              rows = re.finditer(r'^test ' + re.escape(name) + r' \.\.\.([^\n]*)$', log, re.M)
              first = next(rows, None)
              if first is None:
                  return {'status': 'unreported', 'result': None}
              result = known_results.get(first[1])
              if result is None or next(rows, None) is not None:
                  return {'status': 'ambiguous', 'result': None}
              return {'status': 'matched', 'result': result}

          def finite_summary(log):
              rows = list(itertools.islice(re.finditer(r'^test result:[^\n]*$', log, re.M), 2))
              if len(rows) != 1:
                  return None
              match = re.fullmatch(
                  r'test result: (ok|FAILED)\. ([0-3]) passed; ([0-3]) failed; ([0-3]) ignored; '
                  r'0 measured; [0-9]+ filtered out; finished in [0-9]+(?:\.[0-9]+)?s', rows[0][0])
              if match is None:
                  return None
              state = match[1]
              passed, failed, ignored = map(int, match.group(2, 3, 4))
              if passed + failed + ignored > len(targets) or (state == 'ok') != (failed == 0):
                  return None
              return {'state': state, 'passed': passed, 'failed': failed, 'ignored': ignored}

          def build_binding():
              # The pre-run gate has already verified this pair and the copied receipts.
              try:
                  raw = native_log.with_name('build-pair.json').read_bytes()
                  pair = json.loads(raw)
                  commit = pair['workspace_commit']
                  digests = {
                      'build_pair_sha256': hashlib.sha256(raw).hexdigest(),
                      'source_inputs_sha256': pair['source_inputs_sha256'],
                      'test_source_closure_sha256': pair['test_source_closure']['sha256'],
                      'test_binary_sha256': pair['test_executable']['sha256'],
                      'serving_binary_sha256': pair['serving_executable']['sha256'],
                      'test_receipt_sha256': pair['test_receipt']['receipt_sha256'],
                      'serving_receipt_sha256': pair['serving_receipt']['receipt_sha256'],
                  }
                  if (re.fullmatch(r'(?:[0-9a-f]{40}|[0-9a-f]{64})', commit)
                          and all(re.fullmatch(r'[0-9a-f]{64}', value) for value in digests.values())):
                      return {'workspace_commit': commit, **digests}
              except (OSError, ValueError, KeyError, TypeError, RecursionError):
                  pass
              return None

          def read_native_input():
              try:
                  snapshot = native_log.read_bytes()
              except OSError:
                  return None, {'state': 'unreadable', 'sha256': None, 'byte_length': None}
              provenance = {'state': 'read', 'sha256': hashlib.sha256(snapshot).hexdigest(),
                            'byte_length': len(snapshot)}
              try:
                  # Preserve read_text's encoding and universal newline behavior.
                  with io.TextIOWrapper(io.BytesIO(snapshot)) as stream:
                      return stream.read(), provenance
              except UnicodeError:
                  provenance['state'] = 'undecodable'
                  return None, provenance

          def warn_outcome_write():
              print('warning: #126 native outcome report could not be written', file=sys.stderr)

          def write_outcome(verdict, log, provenance):
              tests = {name: case_outcome(log or '', name) for name in targets}
              summary = finite_summary(log or '')
              binding = build_binding()
              completed = re.finditer(r'^test ([A-Za-z0-9_]+) \.\.\. (?:ok|FAILED|ignored)$', log or '', re.M)
              complete = (log is not None and exit_code is not None and binding is not None and summary is not None
                          and all(case['status'] == 'matched' for case in tests.values())
                          and all(row[1] in targets for row in completed)
                          and all(summary[key] == sum(case['result'] == result for case in tests.values())
                                  for key, result in (('passed', 'ok'), ('failed', 'failed'), ('ignored', 'ignored'))))
              outcome = {
                  'version': 2, 'issue': 126, 'suite': 'blob_git_gateway',
                  'acceptance_verdict': verdict, 'diagnostic_complete': complete,
                  'phase': ('complete' if verdict == 'passed' else 'log_unreadable' if log is None
                            else 'native_exit' if status != '0' else 'acceptance_check'),
                  'exit_code': exit_code, 'native_input': provenance,
                  'tests': tests, 'skipped': skipped, 'summary': summary, 'binding': binding,
              }
              pending = outcome_path.with_name('.native-outcome.tmp')
              try:
                  pending.unlink(missing_ok=True)
                  pending.write_text(json.dumps(outcome, indent=2) + '\n')
                  pending.replace(outcome_path)
              except OSError:
                  try:
                      pending.unlink(missing_ok=True)
                  except OSError:
                      pass
                  warn_outcome_write()

          def check_acceptance(log):
              if log is None:
                  raise SystemExit('native log check failed: output unreadable')
              if status != '0':
                  raise SystemExit('native log check failed: test executable exit status '
                                   + ('unknown' if exit_code is None else str(exit_code)))
              rows = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',
                                log, re.MULTILINE)
              if rows != [('ok', '3', '0', '0')]:
                  raise SystemExit('native log check failed: expected exactly one "test result: ok. 3 passed; 0 failed; 0 ignored" row')
              ok_names = re.findall(r'^test ([A-Za-z0-9_]+) \.\.\. ok$', log, re.MULTILINE)
              for name in targets:
                  count = ok_names.count(name)
                  if count != 1 or re.search(r'^test ' + re.escape(name) + r' \.\.\. (?!ok$)', log, re.MULTILINE):
                      raise SystemExit('native log check failed: target ' + name + ' was not reported "ok" exactly once')
              extra = sorted(set(ok_names) - set(targets))
              if extra:
                  raise SystemExit('native log check failed: unexpected completed tests')
              failures = re.findall(r'^test ([A-Za-z0-9_]+) \.\.\. (FAILED|ignored)$', log, re.MULTILINE)
              if failures:
                  raise SystemExit('native log check failed: target failures/ignored')
              native_log.with_name('acceptance.json').write_text(json.dumps({
                  'version': 1, 'issue': 126, 'suite': 'blob_git_gateway',
                  'accepted': True,
                  'tests': {name: 'ok' for name in targets},
                  'skipped': skipped,
                  'result': {'state': 'ok', 'passed': 3, 'failed': 0, 'ignored': 0},
              }, indent=2) + '\n')

          publish_outcome = True
          try:
              outcome_path.unlink(missing_ok=True)
          except OSError:
              warn_outcome_write()
              publish_outcome = False
          log, provenance = read_native_input()
          verdict = 'failed'
          try:
              check_acceptance(log)
              verdict = 'passed'
          finally:
              if publish_outcome:
                  write_outcome(verdict, log, provenance)
          PY
          [ "$status" -eq 0 ]
      - name: Exercise the Git LFS remote read contract against the job-owned Garage fixture
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          : "${ROOTYARD_LFS_BIN:?missing immutable #126 CLI snapshot}"
          : "${ROOTYARD_LFS_RECEIPT:?missing immutable #126 CLI receipt}"
          mkdir -p test-results/refstore
          # Preserve the named raw receipt input as the same bytes of the
          # canonical adjacent immutable alias; never re-serialize it.
          cp "$ROOTYARD_LFS_RECEIPT" test-results/refstore/lfs-build-receipt.json
          cmp "$ROOTYARD_LFS_RECEIPT" test-results/refstore/lfs-build-receipt.json
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_TEST_GIT="$(command -v git)"
