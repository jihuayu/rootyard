name: RefStore protocol native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/refstore-protocol-acceptance.yml'
      - 'src/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'rust-toolchain.toml'
      - 'migrations/**'
      - 'tests/blob_store_w1c_contract.rs'
      - 'tests/blob_store_w1c_native.py'
      - 'tests/ref_store_*.rs'
      - 'tests/refstore_roots_http.py'
      - 'tests/refstore_snapshot_http.py'
      - 'tests/refstore_root_browse_http.py'
      - 'tests/refstore_cancel_scope_race.py'
      - 'tests/test_root_blob_fault_gate.py'
      - 'tests/test_root_browse_race_cleanup.py'
      - 'tests/test_issue107_http_report_validator.py'
      - 'tests/test_issue107_native11_runner.py'
      - 'tests/test_issue107_hosted_wiring.py'
      - 'tests/test_blob_commit_unknown_ci_wiring.py'
      - 'tests/ref_store_core_support/**'
      - 'tests/verifier_budgets_support/**'
      - 'tests/retention_roots_support/**'
      - 'tests/format22_support/**'
      - 'tests/decision_subset_support/**'
      - 'tests/blob_git_gateway.rs'
      - 'tests/blob_gateway_support/**'
      - 'tests/serving_proof_support/**'
      - 'tests/serving_reads_support/**'
      - 'tests/serving_support/**'
      - 'tests/fixtures/**'
      - 'tests/blob_only_service.py'
      - 'tests/blob_commit_unknown_service.py'
      - 'tests/blob_gateway_browse.py'
      - 'tests/blob_gateway_history.py'
      - 'tests/blob_provisioning_service.py'
      - 'tests/backup_blob_serving147.py'
      - 'tests/backup_blob_serving169_support.py'
      - 'tests/test_backup_blob_serving169_support.py'
      - 'tests/requirements-blob-backup.txt'
      - 'tests/schema_baseline.py'
      - 'tests/e2e.py'
      - 'tests/native_evidence.py'
      - 'tests/owned_fuse_cleanup.py'
      - 'tests/lfs.py'
      - 'tests/lfs_remote_contract.py'
      - 'tests/ops_provenance.py'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: refstore-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_DB: rootyard_protocol
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_protocol"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ISSUE42_MANUAL_REF: refs/heads/codex/goal-issue42-original-ac-source-audit-20261117
      ISSUE42_SLOT_ONE_HANDOFF_MANUAL_REF: refs/heads/codex/goal-issue42-slot-one-handoff-qualification-20261119
      ISSUE42_RECLAIM_READONLY_MANUAL_REF: refs/heads/codex/goal-issue42-reclaim-readonly-qualification-20261119
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard@127.0.0.1:55432/rootyard_protocol
      SESSION174_DATABASE_ADMIN_URL: postgresql://rootyard@127.0.0.1:55432/postgres
      SESSION174_DATABASE_PREFIX: session174_foundation
      FORMAT22_DATABASE_PREFIX: format22_ledger
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reviewed native tool profile
        timeout-minutes: 20
        run: |
          scripts/install_ci_native_tools.sh install \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/refstore/native-tools.json
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record test-results/refstore/cargo-fork.json
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '
      - name: Start the job-owned Garage S3 fixture
        timeout-minutes: 12
        run: |
          scripts/owned_garage_fixture.sh start \
            --directory "$RUNNER_TEMP/refstore-garage" \
            --output-env "$RUNNER_TEMP/refstore-object-store.env" \
            --bucket-prefix rootyard-protocol --region garage
      - name: Exercise roots, decisions, accepted subset and pack-read regressions
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_BLOB_DRIVER=opendal ROOTYARD_BLOB_SERVICE=s3
          export ROOTYARD_BLOB_ENDPOINT="$ROOTYARD_OBJECT_STORE_ENDPOINT"
          export ROOTYARD_BLOB_BUCKET="$ROOTYARD_OBJECT_STORE_BUCKET"
          export ROOTYARD_BLOB_REGION="$ROOTYARD_OBJECT_STORE_REGION"
          export ROOTYARD_BLOB_ACCESS_KEY_ID="$ROOTYARD_OBJECT_STORE_ACCESS_KEY"
          export ROOTYARD_BLOB_SECRET_ACCESS_KEY="$ROOTYARD_OBJECT_STORE_SECRET_KEY"
          export ROOTYARD_BLOB_ROOT="protocol-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export ROOTYARD_TEST_GIT="$(command -v git)"
          mkdir -p test-results/refstore
          cargo test --locked --features pando-lab \
            --test ref_store_retention_roots --test ref_store_decision_subset \
            --test ref_store_packs --test ref_store_materialized_reads \
            -- --ignored --test-threads=1 2>&1 | tee test-results/refstore/native.log
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path('test-results/refstore/native.log').read_text()
          rows = re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)
          assert len(rows) == 4, rows
          assert all(state == 'ok' and failed == ignored == '0' for state, _, failed, ignored in rows), rows
          assert sorted(int(passed) for _, passed, _, _ in rows) == [8, 12, 23, 23], rows
          pathlib.Path('test-results/refstore/native.json').write_text(json.dumps({
              'passed': True, 'suite_counts': [int(row[1]) for row in rows],
              'ignored': 0, 'external_blob_backup': False, 'serving_cutover': False,
          }, indent=2) + '\n')
          PY
      - name: "Create the run-owned #174 foundation database"
        id: session174_db
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "GITHUB_RUN_ID must be numeric" >&2; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo "GITHUB_RUN_ATTEMPT must be numeric" >&2; exit 1 ;; esac
          case "$SESSION174_DATABASE_PREFIX" in *[!a-z0-9_]*) echo "unsafe database prefix" >&2; exit 1 ;; esac
          database="${SESSION174_DATABASE_PREFIX}_r${GITHUB_RUN_ID}_a${GITHUB_RUN_ATTEMPT}"
          if [ "${#database}" -gt 63 ]; then echo "database name exceeds 63 bytes" >&2; exit 1; fi
          connected="$(psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -c 'SELECT current_database()')"
          if [ "$connected" != "postgres" ]; then echo "admin URL must connect to the postgres bootstrap database" >&2; exit 1; fi
          # psql does not interpolate :'variables' inside -c; the SQL must arrive on stdin.
          preexisting="$(psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -v database="$database" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          if [ "$preexisting" != "0" ]; then echo "owned database name already exists; refusing to adopt or overwrite it" >&2; exit 1; fi
          # Record the name before CREATE so the always() cleanup can drop a partial creation.
          echo "database=$database" >> "$GITHUB_OUTPUT"
          psql "$SESSION174_DATABASE_ADMIN_URL" -X -v ON_ERROR_STOP=1 -v database="$database" >/dev/null <<'SQL'
          SELECT format('CREATE DATABASE %I', :'database') \gexec
          SQL
          created="$(psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -v database="$database" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          if [ "$created" != "1" ]; then echo "owned database was not created exactly once" >&2; exit 1; fi
      - name: Build and exercise the minimal Blob standalone service
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # Both builders seal independent immutable CAS snapshots under the one
          # shared per-runner store.  Their --output paths are readonly aliases;
          # the harness derives <fixture>.build.json next to the frozen fixture
          # path, while the standalone CLI alias stays outside the uploaded tree.
          fixture_dir="$GITHUB_WORKSPACE/test-results/refstore"
          artifact_store="$HOME/.cache/rootyard/native-artifacts"
          standalone_dir="$RUNNER_TEMP/refstore-standalone"
          mkdir -p "$standalone_dir"
          unset CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG
          python3 scripts/build_native_test.py --test ref_store_format22_backup_fixture \
            --features pando-lab,format22-fixture --no-default-features --package-debug 0 --strip-debuginfo \
            --artifact-store "$artifact_store" \
            --output "$fixture_dir/ref_store_format22_backup_fixture" \
            > "$fixture_dir/format22-fixture-build.json"
          python3 scripts/build_native.py --no-default-features --package-debug 0 --strip-debuginfo \
            --artifact-store "$artifact_store" \
            --output "$standalone_dir/rootyard" \
            > test-results/refstore/standalone-build.json
          python3 - "$fixture_dir/format22-fixture-build.json" \
            test-results/refstore/standalone-build.json \
            "$fixture_dir/ref_store_format22_backup_fixture" \
            "$fixture_dir/ref_store_format22_backup_fixture.build.json" \
            "$standalone_dir/rootyard" "$standalone_dir/rootyard.build.json" \
            "$GITHUB_ENV" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys

          store = pathlib.Path(os.path.expanduser('~/.cache/rootyard/native-artifacts')).resolve()
          fixture_report, cli_report = (pathlib.Path(value) for value in sys.argv[1:3])
          fixture_alias, fixture_alias_receipt = (pathlib.Path(value) for value in sys.argv[3:5])
          cli_alias, cli_alias_receipt = (pathlib.Path(value) for value in sys.argv[5:7])
          github_env = pathlib.Path(sys.argv[7])
          HEX64 = re.compile(r'^[0-9a-f]{64}$')
          STORE_SCHEMA = 'rootyard/native-artifact-store/v1'


          def fail(message):
              raise SystemExit('immutable native metadata: ' + message)


          def sha(path):
              digest = hashlib.sha256()
              with pathlib.Path(path).open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b''):
                      digest.update(chunk)
              return digest.hexdigest()


          def readonly_file(path, label):
              path = pathlib.Path(path)
              if not path.is_absolute() or '..' in path.parts:
                  fail(label + ' is not a safe absolute path: ' + str(path))
              if path.is_symlink() or not path.is_file():
                  fail(label + ' is not a regular non-symlink file: ' + str(path))
              info = path.stat()
              if not stat.S_ISREG(info.st_mode):
                  fail(label + ' is not a regular file: ' + str(path))
              if info.st_uid != os.geteuid():
                  fail(label + ' is not owned by the current user: ' + str(path))
              if info.st_mode & 0o222:
                  fail(label + ' must be readonly: ' + str(path))
              return path


          def load(path, label):
              try:
                  payload = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError) as error:
                  fail(label + ' is not readable JSON: ' + type(error).__name__)
              if not isinstance(payload, dict):
                  fail(label + ' is not a JSON object')
              return payload


          def require_store(payload, alias, alias_receipt, label):
              record = payload.get('artifact_store')
              if not isinstance(record, dict):
                  fail(label + ' has no artifact_store record')
              if record.get('schema') != STORE_SCHEMA:
                  fail(label + ' artifact_store schema is invalid')
              root = pathlib.Path(record.get('root') or '')
              if not root.is_absolute() or root.resolve() != store:
                  fail(label + ' artifact_store root is not the shared store')
              binary = readonly_file(record.get('binary'), label + ' canonical binary')
              receipt = readonly_file(record.get('receipt'), label + ' canonical receipt')
              build_receipt = readonly_file(
                  record.get('build_receipt'), label + ' canonical build receipt')
              objects = readonly_file(record.get('object'), label + ' content object')
              for path, name in ((binary, 'binary'), (receipt, 'receipt'),
                                 (build_receipt, 'build receipt'), (objects, 'object')):
                  if store != path and store not in path.parents:
                      fail(label + ' ' + name + ' is outside the shared store')
              if receipt.name != binary.name + '.receipt.json':
                  fail(label + ' canonical receipt is not adjacent to the binary')
              if build_receipt.name != binary.name + '.build.json':
                  fail(label + ' canonical build receipt is not adjacent to the binary')
              if receipt.parent != binary.parent or build_receipt.parent != binary.parent:
                  fail(label + ' canonical receipts are not adjacent to the binary')
              binary_sha = record.get('binary_sha256')
              if not isinstance(binary_sha, str) or HEX64.fullmatch(binary_sha) is None:
                  fail(label + ' artifact_store binary_sha256 is invalid')
              for path, name in ((binary, 'canonical binary'), (objects, 'content object'),
                                 (readonly_file(alias, label + ' output alias'), 'output alias')):
                  if sha(path) != binary_sha:
                      fail(label + ' ' + name + ' does not match the sealed digest')
              if sha(build_receipt) != sha(readonly_file(alias_receipt, label + ' alias receipt')):
                  fail(label + ' alias receipt bytes differ from the canonical build receipt')
              output = record.get('output_alias')
              if not isinstance(output, dict):
                  fail(label + ' artifact_store has no output_alias record')
              if pathlib.Path(output.get('path') or '').resolve() != alias.resolve():
                  fail(label + ' output_alias path is not the frozen alias')
              if pathlib.Path(output.get('receipt') or '').resolve() != alias_receipt.resolve():
                  fail(label + ' output_alias receipt is not adjacent to the frozen alias')
              if output.get('method') not in ('hardlink', 'copy'):
                  fail(label + ' output_alias method is invalid')
              if not isinstance(output.get('same_inode_as_cas_object'), bool):
                  fail(label + ' output_alias inode observation is invalid')
              if output.get('overwrote_existing') is not False:
                  fail(label + ' output_alias must not overwrite an existing path')
              return record


          fixture = require_store(
              load(fixture_report, 'format22 fixture report'),
              fixture_alias, fixture_alias_receipt, 'format22 fixture')
          cli = require_store(
              load(cli_report, 'standalone CLI report'),
              cli_alias, cli_alias_receipt, 'standalone CLI')
          exported = {
              'ROOTYARD_ARTIFACT_STORE': str(store),
              'ROOTYARD_FORMAT22_FIXTURE': fixture['binary'],
              'ROOTYARD_FORMAT22_FIXTURE_RECEIPT': fixture['build_receipt'],
              'ROOTYARD_STANDALONE_BIN': cli['binary'],
              'ROOTYARD_STANDALONE_RECEIPT': cli['build_receipt'],
          }
          for name, value in exported.items():
              if '\n' in value or '\r' in value or '\x00' in value:
                  fail(name + ' is not a single safe line')
              if re.fullmatch(r'[A-Z][A-Z0-9_]*', name) is None:
                  fail('unsafe environment name')
          with github_env.open('a', encoding='utf-8') as stream:
              for name, value in exported.items():
                  stream.write(name + '=' + value + '\n')
          PY
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_BLOB_DRIVER=opendal ROOTYARD_BLOB_SERVICE=s3
          export ROOTYARD_BLOB_ENDPOINT="$ROOTYARD_OBJECT_STORE_ENDPOINT"
          export ROOTYARD_BLOB_BUCKET="$ROOTYARD_OBJECT_STORE_BUCKET"
          export ROOTYARD_BLOB_REGION="$ROOTYARD_OBJECT_STORE_REGION"
          export ROOTYARD_BLOB_ACCESS_KEY_ID="$ROOTYARD_OBJECT_STORE_ACCESS_KEY"
          export ROOTYARD_BLOB_SECRET_ACCESS_KEY="$ROOTYARD_OBJECT_STORE_SECRET_KEY"
          export ROOTYARD_BLOB_ROOT="standalone-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export ROOTYARD_GIT="$(command -v git)"
          binary="$standalone_dir/rootyard"
          fixture="$fixture_dir/ref_store_format22_backup_fixture"
          # tests/blob_only_service.py -> e2e.Harness.setup() migrates only a random search_path
          # schema, so the job-owned service database needs the production public migration first.
          # The DSN is passed only through the environment and never echoed.
          if ! env DATABASE_URL="$ROOTYARD_TEST_DATABASE_URL" "$binary" migrate \
              > test-results/refstore/standalone-migrate.log 2>&1; then
            # The raw log stays in test-results/ and is collected by the artifact upload;
            # never print it here because diagnostics can include the DSN/credentials.
            echo "standalone Blob gate: production CLI migrate failed on the job-owned database" >&2
            exit 1
          fi
          authority="$(psql "$ROOTYARD_TEST_DATABASE_URL" -X -t -A -v ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('public.cluster_authority') IS NOT NULL")"
          if [ "$authority" != "t" ]; then
            echo "standalone Blob gate: public.cluster_authority is absent from the job-owned database" >&2
            exit 1
          fi
          python3 tests/blob_only_service.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --report test-results/refstore/standalone-http.json
          # Same attested CLI, job-owned PostgreSQL 17 and owned Garage fixture.
          # This is the fixed full three-case inventory; no --case selection.
          # It claims only the standalone managed-PG/Blob path, not a Cancel/Commit
          # race, power loss, automatic pending recommit or distributed authority.
          python3 tests/blob_commit_unknown_service.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --report test-results/refstore/standalone-commit-unknown.json
          python3 - <<'PY'
          import json, os, pathlib, re
          expected = [
              'receive_pack_commit_unknown_resolves_exact',
              'exact_receive_post_replays_before_native_without_second_effect',
              'registered_read_cycles_do_not_exhaust_retained_snapshot_quota',
          ]
          path = pathlib.Path('test-results/refstore/standalone-commit-unknown.json')
          report = json.loads(path.read_text())
          hex64 = re.compile(r'^[0-9a-f]{64}$')
          assert report.get('kind') == 'rootyard/blob-only-native-acceptance', report.get('kind')
          assert report.get('passed') is True, 'commit-unknown report did not pass'
          assert report.get('measurement_kind') == 'native_execution', report.get('measurement_kind')
          assert report.get('simulated_fields') is False, report.get('simulated_fields')
          assert report.get('qualification_kind') == 'clean-candidate', report.get('qualification_kind')
          assert report.get('inputs_unchanged') is True, report.get('binding_error')
          assert report.get('source_head') == os.environ['GITHUB_SHA'], 'source_head is not GITHUB_SHA'
          profile = report.get('native_profile')
          assert isinstance(profile, dict) and profile.get('attested') is True, 'native profile is not attested'
          assert profile.get('workspace_commit') == report.get('source_head'), 'native profile source differs'
          assert profile.get('source_inputs_sha256') == report.get('source_inputs_sha256'), 'source input binding differs'
          assert profile.get('binary_sha256') == report.get('binary_sha256'), 'binary binding differs'
          assert profile.get('build_receipt_sha256') == report.get('build_receipt_sha256'), 'receipt binding differs'
          for label in ('source_inputs_sha256', 'binary_sha256', 'build_receipt_sha256',
                        'checkpoint_sha256', 'harness_sha256'):
              value = report.get(label)
              assert isinstance(value, str) and hex64.fullmatch(value), 'missing or malformed ' + label
          cases = report.get('cases')
          assert isinstance(cases, list) and len(cases) == 3, 'expected exactly three case records'
          assert report.get('case_count') == report.get('expected_count') == 3, 'case counts are not exactly 3'
          assert report.get('expected_cases') == expected, 'expected case inventory differs'
          assert [case.get('name') for case in cases] == expected, 'executed case inventory/order differs'
          assert len({case.get('name') for case in cases}) == 3, 'case names are not unique'
          assert all(case.get('status') == 'passed' and not case.get('error') and not case.get('trace')
                     for case in cases), 'a case is not a clean PASS'
          assert report.get('skips') == 0 and report.get('pending_cases') == [], 'a case was skipped or pended'
          hashes = report.get('harness_inputs_sha256')
          assert isinstance(hashes, dict), 'transitive harness inputs are missing'
          for name in ('blob_commit_unknown_service.py', 'blob_only_service.py', 'e2e.py',
                       'native_evidence.py', 'ops_provenance.py', 'owned_fuse_cleanup.py'):
              assert name in hashes and hex64.fullmatch(hashes[name]), 'missing input hash: ' + name
          assert report.get('checkpoint_sha256') == hashes['blob_commit_unknown_service.py'], 'checkpoint hash differs'
          assert report.get('harness_sha256') == hashes['blob_only_service.py'], 'shared harness hash differs'
          assert report.get('harness_inputs', {}).get('input_hashes') == hashes, 'input closure differs'
          print('standalone commit-unknown: 3/3 unique PASS, 0 skips, source/receipt/binary/inputs bound')
          PY
          python3 tests/blob_gateway_browse.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --report test-results/refstore/standalone-browse.json
          python3 tests/blob_gateway_history.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --report test-results/refstore/standalone-history.json
          python3 tests/blob_provisioning_service.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --report test-results/refstore/standalone-provisioning.json
          python3 -m pip install -r tests/requirements-blob-backup.txt
          python3 tests/backup_blob_serving147.py --binary "$binary" --git "$ROOTYARD_GIT" \
            --format22-fixture "$fixture" \
            --report test-results/refstore/standalone-paired-backup.json
      - name: "Build and run the fixed issue107 HTTP13 and native11 acceptance inventory"
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_BLOB_DRIVER=opendal ROOTYARD_BLOB_SERVICE=s3
          export ROOTYARD_BLOB_ENDPOINT="$ROOTYARD_OBJECT_STORE_ENDPOINT"
          export ROOTYARD_BLOB_BUCKET="$ROOTYARD_OBJECT_STORE_BUCKET"
          export ROOTYARD_BLOB_REGION="$ROOTYARD_OBJECT_STORE_REGION"
          export ROOTYARD_BLOB_ACCESS_KEY_ID="$ROOTYARD_OBJECT_STORE_ACCESS_KEY"
          export ROOTYARD_BLOB_SECRET_ACCESS_KEY="$ROOTYARD_OBJECT_STORE_SECRET_KEY"
          export ROOTYARD_BLOB_DELETE=disabled
          export ROOTYARD_BLOB_ROOT="issue107-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
