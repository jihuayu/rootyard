              return True


          def save_consumed_cli_receipt(destination, raw, expected_sha):
              '''Reuse an exact readonly alias or create one absent copy, never replacing it.'''
              destination = pathlib.Path(destination)
              if _existing_cli_receipt_copy_matches(destination, raw, expected_sha):
                  return 'reused'
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, 'O_NOFOLLOW', 0)
              for _attempt in range(3):
                  try:
                      fd = os.open(destination, flags, 0o444)
                  except FileExistsError:
                      # A concurrent producer won the creation race.  Reuse its
                      # exact bytes if they match; otherwise fail without replacing it.
                      if _existing_cli_receipt_copy_matches(destination, raw, expected_sha):
