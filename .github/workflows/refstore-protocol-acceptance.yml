                      if not isinstance(path, str) or not isinstance(value, str) or not hex64.fullmatch(value):
                          fail('receipt test-support inventory entry is malformed')
                      digest.update(path.encode('utf-8') + b'\0')
                      digest.update(bytes.fromhex(value))
              return digest.hexdigest()


