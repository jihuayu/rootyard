          import hashlib, json, pathlib, sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          try:
              preflight = json.loads((source / 'preflight.json').read_text())
          except (OSError, ValueError) as error:
              raise SystemExit('session174 receipt copy check failed: unreadable preflight evidence: '
                               + type(error).__name__)
          checked = {}
          for key, name in (('lib_receipt', 'session174-lib-tests.build.json'),
                            ('cli_receipt', 'rootyard-cli.build.json')):
              record = preflight.get(key)
              if not isinstance(record, dict):
                  raise SystemExit('session174 receipt copy check failed: ' + key + ' is missing')
              anchored = record.get('sha256')
              if not isinstance(anchored, str) or len(anchored) != 64:
                  raise SystemExit('session174 receipt copy check failed: ' + key + ' has no anchored SHA-256')
              consumed = record.get('path')
              if not isinstance(consumed, str) or not consumed:
                  raise SystemExit('session174 receipt copy check failed: ' + key + ' has no consumed path')
              for candidate in (source / name, target / name):
                  if not candidate.is_file():
                      raise SystemExit('session174 receipt copy check failed: ' + key
                                       + ' copy is missing at ' + str(candidate))
                  actual = hashlib.sha256(candidate.read_bytes()).hexdigest()
                  if actual != anchored:
                      raise SystemExit('session174 receipt copy check failed: ' + key
                                       + ' bytes changed after verification')
              checked[key] = {'consumed_path': consumed,
                              'evidence_path': str(source / name),
                              'upload_path': str(target / name),
                              'sha256': anchored}
          document = {'version': 1, 'issue': 174, 'checked': checked}
          (source / 'receipt-copy-check.json').write_text(json.dumps(document, indent=2) + '\n')
          (target / 'receipt-copy-check.json').write_text(json.dumps(document, indent=2) + '\n')
