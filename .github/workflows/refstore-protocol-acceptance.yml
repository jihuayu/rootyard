          python3 scripts/build_native_test.py --test blob_store_w1c_contract --features pando-lab \
            --no-default-features --package-debug 0 --strip-debuginfo \
            --artifact-store "$artifact_store" --output "$w1c_bin" > "$w1c_report"
          set -a
          . "$RUNNER_TEMP/refstore-object-store.env"
          set +a
          export ROOTYARD_BLOB_DRIVER=opendal ROOTYARD_BLOB_SERVICE=s3
          export ROOTYARD_BLOB_ENDPOINT="$ROOTYARD_OBJECT_STORE_ENDPOINT"
          export ROOTYARD_BLOB_BUCKET="$ROOTYARD_OBJECT_STORE_BUCKET"
          export ROOTYARD_BLOB_REGION="$ROOTYARD_OBJECT_STORE_REGION"
          export ROOTYARD_BLOB_ACCESS_KEY_ID="$ROOTYARD_OBJECT_STORE_ACCESS_KEY"
          export ROOTYARD_BLOB_SECRET_ACCESS_KEY="$ROOTYARD_OBJECT_STORE_SECRET_KEY"
          export ROOTYARD_BLOB_ROOT="w1c-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "GITHUB_RUN_ID must be numeric" >&2; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo "GITHUB_RUN_ATTEMPT must be numeric" >&2; exit 1 ;; esac
          w1c_db="rootyard_run_w1c_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [ "${#w1c_db}" -gt 63 ]; then echo "w1c database name exceeds 63 bytes" >&2; exit 1; fi
          preexisting="$(psql --host 127.0.0.1 --port 55432 --username rootyard --dbname postgres \
            --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            -v database="$w1c_db" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          if [ "$preexisting" != "0" ]; then
            echo "owned w1c database already exists; refusing to adopt it" >&2
            exit 1
          fi
          createdb --host 127.0.0.1 --port 55432 --username rootyard "$w1c_db"
          export DATABASE_URL="postgresql://rootyard@127.0.0.1:55432/$w1c_db"
          export ROOTYARD_TEST_DATABASE_URL="$DATABASE_URL"
          python3 tests/blob_store_w1c_native.py \
            --build-receipt "$w1c_bin.build.json" \
            --build-report "$w1c_report" \
            --binary "$w1c_bin" \
            --expected-store-root "$artifact_store" \
            --receipt-copy "$report_dir/blob_store_w1c_contract.build.json" \
            --canonical-path-out "$w1c_dir/w1c-exec.path" \
            --report "$report_dir/acceptance.json" \
            --summary-log "$report_dir/w1c-summary.log" \
            --expected-commit "$GITHUB_SHA" \
            --require-cas \
            --require-ci-pins \
            --require-package-debug-zero \
            --require-strip-debuginfo
          w1c_exec="$(cat "$w1c_dir/w1c-exec.path")"
          python3 scripts/native_report_manifest.py --mode job \
            --build-receipt "$report_dir/blob_store_w1c_contract.build.json" \
            --binary "$w1c_exec" \
            --expect-commit "$GITHUB_SHA" \
            --report "w1c=$report_dir/acceptance.json" \
            --require-case "w1c=pg_protected_uploader_preflight_preserves_unconsumed_holds" \
            --require-case "w1c=pg_protected_uploader_consume_and_upload_encrypted_against_real_provider" \
            --log "w1c-summary=$report_dir/w1c-summary.log" \
            --log-marker "w1c-summary=w1c native acceptance: passed (2 cases)" \
            --harness "tests/blob_store_w1c_native.py" \
            --harness "tests/blob_store_w1c_contract.rs" \
            --fixture-rust-from-receipt \
            --fixture postgres=postgres:17 \
            --fixture "garage=Garage v2.1.0 sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78e93ee8da7cf6a" \
            --manifest-out test-results/refstore/w1c-native-job.json
      - name: "Drop only the job-owned #109 w1c database"
        if: always()
        env:
          PGOPTIONS: ''
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "GITHUB_RUN_ID must be numeric" >&2; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo "GITHUB_RUN_ATTEMPT must be numeric" >&2; exit 1 ;; esac
          w1c_db="rootyard_run_w1c_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          dropdb --host 127.0.0.1 --port 55432 --username rootyard --if-exists "$w1c_db"
          absent="$(psql --host 127.0.0.1 --port 55432 --username rootyard --dbname postgres \
            --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            -v database="$w1c_db" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          test "$absent" = "0"
      - name: Stop only the job-owned Garage fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/refstore-garage/.rootyard-owned-fixture" ]; then
            scripts/owned_garage_fixture.sh stop --directory "$RUNNER_TEMP/refstore-garage"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refstore-protocol-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/refstore/
            !test-results/refstore/blob_git_gateway/native.log
          if-no-files-found: error
