                  record['exit_code'] = None
                  record['errors'].append('runner error ' + type(error).__name__)
                  save(log, '$ libtest --ignored --exact ' + name + ' --test-threads=1\n'
                       + '$ runner error ' + type(error).__name__ + '\n')
              # Missing/multiple summaries, ignored or zero-run cases and exit failures are failures.
              record['passed'] = 0 if record['errors'] else passed_count
              record['failed'] = 1 if record['errors'] else max(failed_count, 1 if passed_count == 0 else 0)
              record['ignored'] = ignored_count
              record['result'] = 'passed' if not record['errors'] else 'failed'
              results.append(record)
              print('case ' + str(index) + ': ' + record['result'] + ' ' + name)
              for error in record['errors']:
                  print('  failure: ' + error)
          required = [(index, name) for index, name in enumerate(names, 1)]
          complete = len(results) == len(required) and all(
              (record['index'], record['name']) == (index, name) for record, (index, name) in zip(results, required))
          passed_total = sum(item['passed'] for item in results)
          failed_total = sum(item['failed'] for item in results)
          ignored_total = sum(item['ignored'] for item in results)
          aggregate = {'suite': 'session174-http-foundation', 'required_cases': names,
                       'cases_required': len(names), 'cases_recorded': len(results),
                       'cases_run': len(results), 'records_complete': complete,
                       'passed': passed_total, 'failed': failed_total, 'ignored': ignored_total,
                       'summary': (str(passed_total) + ' passed, ' + str(failed_total) + ' failed, '
                                   + str(ignored_total) + ' ignored'),
                       'cases': results}
          complete = complete and all(item['result'] == 'passed' for item in results)
          expected_total = len(names)
          ok = (complete and (passed_total, failed_total, ignored_total) == (expected_total, 0, 0)
                and all(item['exit_code'] == 0 for item in results))
          aggregate['ok'] = ok
          aggregate['summary'] = (str(expected_total) + ' passed, 0 failed, 0 ignored' if ok
                                  else aggregate['summary'])
          save(evidence / 'session174-foundation.json', json.dumps(aggregate, indent=2) + '\n')
          print('session174 cases: ' + aggregate['summary']
                + (' (ok)' if ok else ' (FAILED; report written with ' + str(len(results)) + ' case records)'))
          sys.exit(0 if ok else 1)
          PY
          then
            status=0
          else
            status=$?
          fi
          cp "$evidence/preflight.json" "$evidence/preflight.log" \
            "$evidence/session174-lib-tests.build.json" "$evidence/session174-lib-tests.stdout.log" \
            "$evidence/rootyard-cli.build.json" "$evidence/standalone-build.json" \
            "$evidence/cases.log" "$evidence/session174-foundation.json" \
            test-results/refstore/session174-foundation/ 2>/dev/null || true
          # Every required case writes its own case-N.log; copy all of them.
          for log in "$evidence"/case-*.log; do
            if [ -f "$log" ]; then cp "$log" test-results/refstore/session174-foundation/; fi
          done
          if [ "$status" -ne 0 ]; then
            echo "session174 cases failed (status $status)" >&2
            exit "$status"
          fi
      - name: "Drop only the run-owned #174 foundation database"
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          SESSION174_DATABASE: ${{ steps.session174_db.outputs.database }}
          # Never inherit a search_path or other server option from the job environment.
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/session174-foundation"
          mkdir -p "$evidence" test-results/refstore/session174-foundation
          copy_log() {
            [ -f "$evidence/database-cleanup.log" ] || return 0
            cp "$evidence/database-cleanup.log" test-results/refstore/session174-foundation/
          }
          trap copy_log EXIT
          if [ -z "${SESSION174_DATABASE:-}" ]; then
            echo "owned database was not created; nothing to drop" > "$evidence/database-cleanup.log"
            exit 0
          fi
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "GITHUB_RUN_ID must be numeric" >&2; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo "GITHUB_RUN_ATTEMPT must be numeric" >&2; exit 1 ;; esac
          expected="${SESSION174_DATABASE_PREFIX}_r${GITHUB_RUN_ID}_a${GITHUB_RUN_ATTEMPT}"
          if [ "$SESSION174_DATABASE" != "$expected" ]; then echo "refusing to drop a database not owned by this run" >&2; exit 1; fi
          case "$SESSION174_DATABASE" in ''|*[!a-z0-9_]*|postgres|rootyard_protocol|template*)
            echo "refusing to drop a shared or unsafe database" >&2
            exit 1
            ;;
          esac
          # Written before psql so the collected evidence exists even if cleanup fails mid-way.
          printf 'owned database %s\n' "$SESSION174_DATABASE" > "$evidence/database-cleanup.log"
          {
            psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -v database="$SESSION174_DATABASE" <<'SQL'
          SELECT 'owned_before=' || count(*) FROM pg_database WHERE datname = :'database';
          SELECT format('DROP DATABASE IF EXISTS %I', :'database') \gexec
          SELECT 'owned_after=' || count(*) FROM pg_database WHERE datname = :'database';
          SQL
            echo "owned database dropped; shared databases untouched"
          } >> "$evidence/database-cleanup.log" 2>&1
          cat "$evidence/database-cleanup.log"
          remaining="$(psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -v database="$SESSION174_DATABASE" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          if [ "$remaining" != "0" ]; then echo "owned database still exists after cleanup" >&2; exit 1; fi
      - name: "Drop only the run-owned format22 ledger-validation database"
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          FORMAT22_DATABASE: ${{ steps.format22_pg_tests.outputs.database }}
          # Never inherit a search_path or other server option from the job environment.
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          if [ -z "${FORMAT22_DATABASE:-}" ]; then
            echo "owned format22 database was not created; nothing to drop"
            exit 0
          fi
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "GITHUB_RUN_ID must be numeric" >&2; exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo "GITHUB_RUN_ATTEMPT must be numeric" >&2; exit 1 ;; esac
          expected="${FORMAT22_DATABASE_PREFIX}_r${GITHUB_RUN_ID}_a${GITHUB_RUN_ATTEMPT}"
          if [ "$FORMAT22_DATABASE" != "$expected" ]; then echo "refusing to drop a database not owned by this run" >&2; exit 1; fi
          case "$FORMAT22_DATABASE" in ''|*[!a-z0-9_]*|postgres|rootyard_protocol|template*)
            echo "refusing to drop a shared or unsafe database" >&2
            exit 1
            ;;
          esac
          psql "$SESSION174_DATABASE_ADMIN_URL" -X -v ON_ERROR_STOP=1 -v database="$FORMAT22_DATABASE" >/dev/null <<'SQL'
          SELECT format('DROP DATABASE IF EXISTS %I', :'database') \gexec
          SQL
          remaining="$(psql "$SESSION174_DATABASE_ADMIN_URL" -X -t -A -v ON_ERROR_STOP=1 -v database="$FORMAT22_DATABASE" <<'SQL'
          SELECT count(*) FROM pg_database WHERE datname = :'database';
          SQL
          )"
          if [ "$remaining" != "0" ]; then echo "owned format22 database still exists after cleanup" >&2; exit 1; fi
      - name: "Collect #174 acceptance evidence"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/session174-foundation"
          upload=test-results/refstore/session174-foundation
          if [ ! -d "$evidence" ]; then
            echo "no session174 acceptance evidence was produced"
            exit 0
          fi
          mkdir -p "$upload"
          for name in preflight.json preflight.log session174-lib-tests.build.json \
                      session174-lib-tests.stdout.log rootyard-cli.build.json standalone-build.json \
                      cases.log session174-foundation.json database-cleanup.log; do
            [ -f "$evidence/$name" ] && cp "$evidence/$name" "$upload/"
          done
          # One case-N.log per required case; never a fixed case-1..case-4 list.
          for log in "$evidence"/case-*.log; do
            if [ -f "$log" ]; then cp "$log" "$upload/"; fi
          done
          ls -la "$upload"
      - name: Stop only the job-owned Garage fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/refstore-garage/.rootyard-owned-fixture" ]; then
            scripts/owned_garage_fixture.sh stop --directory "$RUNNER_TEMP/refstore-garage"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refstore-protocol-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/refstore/
          if-no-files-found: error
