name: Redis contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-contract:
    # Disposable real-Redis contract gate for the optional state-redis feature.
    # It is separate from the ordinary verify job and never changes host trust.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Redis contract native prerequisites
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates openssl libssl-dev pkg-config cmake clang \
            libfuse3-dev fuse3 build-essential
      - name: Install pinned Rust 1.99.1 gate tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc -V && cargo -V && cargo clippy -V
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: state-redis-contract
          workspaces: ". -> target"
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record test-results/state-redis/cargo-fork.json
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '
      - name: Pull the official Redis 7.2.6 image
        run: docker pull redis:7.2.6-alpine
      - name: Unit-test the contract runner without Docker
        run: python3 -m unittest discover -s tests -p 'test_check_redis_contract.py'
      - name: Clippy all targets with state-redis and warnings denied
        run: cargo clippy --locked --all-targets --features state-redis -- -D warnings
      - name: Build the fixed state-redis lib-test prebuilt artifact
        timeout-minutes: 30
        run: |
          mkdir -p test-results/state-redis
          python3 scripts/build_native_test.py \
            --lib \
            --features state-redis \
            --package-debug 0 \
            --strip-debuginfo \
            --output test-results/state-redis/rootyard-lib-test \
            > test-results/state-redis/build-summary.json
      - name: Run owned plaintext, TLS, untrusted-CA and restored-trust contract
        run: |
          mkdir -p test-results/state-redis
          python3 scripts/check_redis_contract.py \
            --executable test-results/state-redis/rootyard-lib-test \
            --build-receipt test-results/state-redis/rootyard-lib-test.build.json \
            --report test-results/state-redis/contract.json \
            --log-dir test-results/state-redis/logs
      - name: Upload Redis contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-contract-report
          path: |
            test-results/state-redis/cargo-fork.json
            test-results/state-redis/contract.json
            test-results/state-redis/logs/*.log
            test-results/state-redis/rootyard-lib-test.build.json
            test-results/state-redis/build-summary.json
          if-no-files-found: warn
