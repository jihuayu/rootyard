name: Native kernel cgroup acceptance

# Manual feature acceptance only. This is intentionally not part of ordinary
# push/pull_request CI. The default dispatch runs the cgroup v2 job; the opt-in
# fuse_compat input also runs the hosted FUSE compatibility witness. Both need
# a disposable PostgreSQL service; the cgroup job also needs a cgroup v2 VM
# with root delegation.
on:
  workflow_dispatch:
    inputs:
      fuse_compat:
        description: "Also run the hosted FUSE compatibility witness on the attested build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-kernel-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-kernel-cgroup:
    name: Delegated cgroup v2 native acceptance
    # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, so
    # Bubblewrap cannot create the sandbox on a stock runner image and this
    # acceptance would report a false BLOCKED. Ubuntu 22.04 keeps rootless
    # bwrap usable without disabling LSM policy on the managed cloud host; the
    # only other supported target is a dedicated ephemeral VM that is set up
    # for rootless bwrap. Never weaken AppArmor on the current cloud host.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_DB: rootyard_native
          # Ephemeral isolated service; no repository secret is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_native"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ROOTYARD_TEST_CGROUP_ROOT: /sys/fs/cgroup/rootyard-native-${{ github.run_id }}
      ROOTYARD_SANDBOX_MODE: cgroup
      ROOTYARD_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}
      TMPDIR: /tmp
      PG_URL_BASE: postgresql://rootyard@127.0.0.1:5432
      NATIVE_DB: rootyard_native_cgroup_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Prepare paths outside the checkout
        run: |
          echo "RECEIPT_DIR=$RUNNER_TEMP/native-kernel" >>"$GITHUB_ENV"
          echo "RECEIPT=$RUNNER_TEMP/native-kernel/receipt.json" >>"$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/native-kernel/evidence" >>"$GITHUB_ENV"
          echo "ROOTYARD_TEST_TMPFS_ROOT=$RUNNER_TEMP/rootyard-native-pool-$GITHUB_RUN_ID" >>"$GITHUB_ENV"

      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the project Python version
        uses: actions/setup-python@v5
        with:
          # Ubuntu 22.04's system Python is 3.10; the acceptance harness targets
          # the project's 3.12. setup-python prepends its bin directory to PATH
          # for every later step, and that PATH is handed to the test unchanged.
          python-version: "3.12"

      - name: Install native sandbox toolchain and PostgreSQL 17 clients
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap ca-certificates curl gcc git gnupg libc6-dev python3 util-linux
          # The service is postgres:17. psql/createdb from an older client can
          # connect, but pg_dump must match the server major version for a real
          # roundtrip, and Ubuntu 22.04 only ships 14/16. Install 17 from the
          # signed official PGDG repository.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Put the 17 clients first on PATH for every later step. The native
          # test runs as the ordinary runner account (no sudo/runuser), so this
          # PATH is handed to the test and its service unchanged.
          echo "/usr/lib/postgresql/17/bin" >>"$GITHUB_PATH"
          bwrap --version
          gcc --version | head -1

      - name: Install a bubblewrap that implements --size
        timeout-minutes: 12
        run: |
          # The production runtime bounds /tmp and /workspace with
          # `--size BYTES --tmpfs DEST`. Ubuntu 22.04 ships bubblewrap 0.6.1,
          # which predates --size, so every job failed before the start gate on
          # the first hosted run. Build the same source Ubuntu 24.04 ships from
          # the signed Ubuntu archive source index (verified by the archive key
          # already trusted on this runner), install it to /usr/local/bin so it
          # precedes /usr/bin, and require the capability functionally. AppArmor
          # and the rest of the runner policy are left untouched.
          sudo apt-get install -y --no-install-recommends dpkg-dev libcap-dev meson ninja-build pkg-config
          echo "deb-src [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu noble main universe" \
            | sudo tee /etc/apt/sources.list.d/ubuntu-noble-src.list >/dev/null
          sudo apt-get update
          # Reproducible pin: the exact source release offered by the signed
          # archive. If that exact version is no longer published, fail with
          # the available versions instead of silently building a different one.
          pin=0.9.0-1build1
          available=$(apt-cache showsrc bubblewrap | sed -n 's/^Version: //p' | sort -u | tr '\n' ' ')
          echo "available noble bubblewrap source versions: $available"
          case " $available " in
            *" $pin "*) ;;
            *)
              echo "pinned bubblewrap source $pin is not offered by the signed archive; available: $available" >&2
              exit 1
              ;;
          esac
          work=$(mktemp -d)
          (cd "$work" && apt-get source "bubblewrap=$pin")
          src=$(find "$work" -maxdepth 1 -mindepth 1 -type d -name 'bubblewrap-*' | head -1)
          test -n "$src"
          version=$(dpkg-parsechangelog -l "$src/debian/changelog" -SVersion)
          echo "bubblewrap source version: $version"
          # Exact pin only: the signed Ubuntu archive provides provenance for
          # this release, and the functional probe below proves the built binary
          # really has --size.
          test "$version" = "$pin"
          (cd "$src" && meson setup _build --prefix=/usr/local && ninja -C _build && sudo ninja -C _build install)
          hash -r
          command -v bwrap
          bwrap --version
          # Functional capability probe: no version parsing, the mount path is
          # the only thing that matters. Bubblewrap starts from an empty root,
          # so bind the host root read-only for /bin/true; probe-only, the job
          # mounts are unchanged.
          bwrap --unshare-all --die-with-parent --ro-bind / / --size 1048576 --tmpfs /tmp -- /bin/true
          echo "bubblewrap with --size support: $(bwrap --version)"
          sha256sum "$(command -v bwrap)"

      - name: Install pinned Rust 1.99.1 toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install and select pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record "$RECEIPT_DIR/cargo-fork.json"
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '

      - name: Build actual production binary from the dispatched commit
        timeout-minutes: 20
        run: |
          mkdir -p "$RECEIPT_DIR" "$EVIDENCE_DIR"
          command -v python3
          python3 --version
          bwrap --version
          python3 --version | grep -Eq '^Python 3\.12\.'
          command -v pg_dump
          pg_dump --version
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          psql --version
          # Source equivalence is proved by commit and hashes: the checked-out
          # HEAD is the dispatched commit, the tree is clean, and the receipt
          # records both source_commit and the binary sha256 that was built.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/build_native.py \
            --artifact-store "$HOME/.cache/rootyard/native-artifacts" \
            | tee "$RECEIPT_DIR/native-build.json"
      - name: Export the canonical built binary and receipt
        run: |
          python3 - "$RECEIPT_DIR/native-build.json" "$GITHUB_ENV" <<'PY'
          import json
          from pathlib import Path
          import sys

          build = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          store = build.get("artifact_store")
          if not isinstance(store, dict):
              raise SystemExit("build_native output has no artifact_store record")
          exported = {}
          for field, name in (
              ("binary", "ROOTYARD_BINARY"),
              ("build_receipt", "ROOTYARD_BUILD_RECEIPT"),
          ):
              value = store.get(field)
              if not isinstance(value, str) or not value:
                  raise SystemExit("artifact_store.%s is missing" % field)
              if "\n" in value or "\r" in value or "\x00" in value:
                  raise SystemExit("artifact_store.%s is not a single safe line" % field)
              path = Path(value)
              if not path.is_absolute() or path.is_symlink() or not path.is_file():
                  raise SystemExit("artifact_store.%s is not an absolute regular file: %s" % (field, value))
              exported[name] = str(path)
          binary = Path(exported["ROOTYARD_BINARY"])
          receipt = Path(exported["ROOTYARD_BUILD_RECEIPT"])
          if receipt != Path(str(binary) + ".build.json"):
              raise SystemExit("build receipt is not adjacent to the canonical binary")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as stream:
              for name in sorted(exported):
                  stream.write("%s=%s\n" % (name, exported[name]))
          PY
      - name: Verify the canonical built binary and copy its raw receipt
        run: |
          set -euo pipefail
          test -x "$ROOTYARD_BINARY"
          test "$("$ROOTYARD_BINARY" --rootyard-hook-self-check)" = rootyard-hook-v1
          sha256sum "$ROOTYARD_BINARY" | tee "$RECEIPT_DIR/binary.sha256"
          cp -- "$ROOTYARD_BUILD_RECEIPT" "$RECEIPT_DIR/rootyard.build.json"

      # Opt-in handoff for the sibling FUSE witness job.  This only copies the
      # already attested build products; it does not change the cgroup
      # acceptance, its database, its evidence or its result.
      - name: Stage the opt-in FUSE build artifact
        if: ${{ inputs.fuse_compat }}
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/fuse-build"
          mkdir -p "$build_dir"
          cp -- "$ROOTYARD_BINARY" "$build_dir/rootyard"
          cp -- "$ROOTYARD_BUILD_RECEIPT" "$build_dir/rootyard.build.json"
          cp -- "$(command -v bwrap)" "$build_dir/bwrap"
          chmod 0755 "$build_dir/rootyard" "$build_dir/bwrap"
          (cd "$build_dir" && sha256sum rootyard bwrap rootyard.build.json >SHA256SUMS)
      - name: Upload the opt-in FUSE build artifact
        if: ${{ inputs.fuse_compat }}
        uses: actions/upload-artifact@v4
        with:
          name: native-fuse-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuse-build
          if-no-files-found: error
          retention-days: 7

      - name: Run production sandbox unit tests
        timeout-minutes: 10
        run: cargo test --locked --lib sandbox

      - name: Delegate run-specific cgroup and mount bounded tmpfs
        id: native_setup
        continue-on-error: true
        timeout-minutes: 3
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          # Root provisions only this run-specific subtree and hands the run
          # root plus its supervisor leaf to the ordinary runner account.
          sudo scripts/native_kernel_cgroup_setup.sh setup "$GITHUB_RUN_ID" "$runner_uid" "$runner_gid"
          sudo mkdir -p "$ROOTYARD_TEST_TMPFS_ROOT"
          sudo mount -t tmpfs -o size=64m,mode=0700,nodev,nosuid,noexec tmpfs "$ROOTYARD_TEST_TMPFS_ROOT"
          # The mount is root-owned 0700 by option; give the bounded 64 MiB
          # mount path (and nothing else) to the ordinary runner account so the
          # service owns and validates its own export pool.
          sudo chown "$runner_uid:$runner_gid" "$ROOTYARD_TEST_TMPFS_ROOT"
          test "$(stat -c %u "$ROOTYARD_TEST_TMPFS_ROOT")" = "$runner_uid"
          test "$(stat -c %a "$ROOTYARD_TEST_TMPFS_ROOT")" = "700"
          capacity=$(python3 -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$ROOTYARD_TEST_TMPFS_ROOT")
          # Acceptance threshold on the real mounted capacity, read from the
          # kernel: never a configured logical byte cap pretending to be the
          # physical tmpfs bound.
          test "$capacity" -gt 0
          test "$capacity" -le 67108864
          echo "ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES=$capacity" >>"$GITHUB_ENV"
          echo "measured artifact tmpfs capacity: $capacity bytes"

      - name: Create the disposable native database
        if: steps.native_setup.outcome == 'success'
        timeout-minutes: 2
        run: createdb -h 127.0.0.1 -p 5432 -U rootyard "$NATIVE_DB"

      - name: Run native cgroup acceptance in the delegated supervisor leaf
        id: native_test
        if: steps.native_setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ROOTYARD_TEST_DATABASE_URL: ${{ env.PG_URL_BASE }}/${{ env.NATIVE_DB }}
          ROOTYARD_NATIVE_RECEIPT: ${{ env.RECEIPT }}
          ROOTYARD_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # Root places the supervisor only. Moving a GHA job process into a
          # private subtree is authorised at the nearest common ancestor (the
          # root cgroup.procs, root-owned), so this one step is privileged; the
          # helper then drops to the account that owns the private run root with
          # setpriv and execs the test in the same PID. PATH (PG 17 clients and
          # Python 3.12) and PYTHONPATH are passed explicitly for that exec.
          sudo -E env \
            "PATH=$PATH" \
            "PYTHONPATH=$PYTHONPATH" \
            "HOME=$HOME" \
            "TMPDIR=$TMPDIR" \
            "ROOTYARD_BINARY=$ROOTYARD_BINARY" \
            "ROOTYARD_SOURCE_COMMIT=$ROOTYARD_SOURCE_COMMIT" \
            "ROOTYARD_SANDBOX_MODE=$ROOTYARD_SANDBOX_MODE" \
            "ROOTYARD_TEST_CGROUP_ROOT=$ROOTYARD_TEST_CGROUP_ROOT" \
            "ROOTYARD_TEST_TMPFS_ROOT=$ROOTYARD_TEST_TMPFS_ROOT" \
            "ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES=$ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES" \
            "ROOTYARD_TEST_DATABASE_URL=$ROOTYARD_TEST_DATABASE_URL" \
            "ROOTYARD_NATIVE_RECEIPT=$ROOTYARD_NATIVE_RECEIPT" \
            "ROOTYARD_EVIDENCE_DIR=$ROOTYARD_EVIDENCE_DIR" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            scripts/native_kernel_cgroup_setup.sh supervisor "$GITHUB_RUN_ID" -- \
              python3 tests/test_sandbox_cgroup_native.py --receipt "$RECEIPT"

      - name: Write or validate sanitized native receipt
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.native_setup.outcome }}
          TEST_OUTCOME: ${{ steps.native_test.outcome }}
        run: |
          mkdir -p "$RECEIPT_DIR" "$EVIDENCE_DIR"
          if [ ! -s "$RECEIPT" ]; then
            python3 - "$RECEIPT" <<'PY'
          import hashlib, json, os, socket, sys, time
          def digest(path):
              try:
                  h = hashlib.sha256()
                  with open(path, "rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          h.update(chunk)
                  return h.hexdigest()
              except OSError:
                  return None
          setup_ok = os.environ.get("SETUP_OUTCOME") == "success"
          # Classification is not a free choice: unavailable setup/preflight is
          # BLOCKED; a successful setup followed by a native assertion process
          # that produced no receipt is FAILED.
          if setup_ok:
              status = "failed"
              reason = "native assertion process exited without writing a receipt"
          else:
              status = "blocked"
              reason = "cgroup delegation/tmpfs setup did not complete"
          receipt = {
              "schema": "rootyard/native-kernel-cgroup-receipt/v1",
              "status": status,
              "profile": os.environ.get("ROOTYARD_SANDBOX_MODE", "unset"),
              "source_commit": os.environ.get("ROOTYARD_SOURCE_COMMIT") or os.environ.get("GITHUB_SHA"),
              "binary_sha256": digest(os.environ.get("ROOTYARD_BINARY"))
              if os.environ.get("ROOTYARD_BINARY") else None,
              "test_file_sha256": digest("tests/test_sandbox_cgroup_native.py"),
              "workflow_file_sha256": digest(".github/workflows/native-kernel-acceptance.yml"),
              "cgroup_root": os.environ.get("ROOTYARD_TEST_CGROUP_ROOT"),
              "tmpfs_root": os.environ.get("ROOTYARD_TEST_TMPFS_ROOT"),
              "pool_max_bytes_config": os.environ.get("ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES"),
              "runner": {
                  "uid": os.getuid(),
                  "gid": os.getgid(),
                  "groups": sorted(os.getgroups()),
                  "euid": os.geteuid(),
              },
              "host": {
                  "kernel": os.uname().release,
                  "python": sys.version.split()[0],
                  "hostname": socket.gethostname(),
              },
              "evidence_dir": os.environ.get("EVIDENCE_DIR"),
              "test_outcome": os.environ.get("TEST_OUTCOME"),
              "preflight": {"reason": reason},
              "assertions": {},
              "generated_unix": int(time.time()),
          }
          with open(sys.argv[1], "w") as handle:
              handle.write(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          fi
          python3 - "$RECEIPT" <<'PY'
          import hashlib, json, os, sys
          data = json.load(open(sys.argv[1]))
          assert data.get("schema") == "rootyard/native-kernel-cgroup-receipt/v1"
          assert data.get("status") in ("passed", "failed", "blocked")
          assert data.get("source_commit") == os.environ.get("GITHUB_SHA")
          digest = hashlib.sha256(open("tests/test_sandbox_cgroup_native.py", "rb").read()).hexdigest()
          assert data.get("test_file_sha256") == digest
          assert data.get("binary_sha256") is not None
          runner = data.get("runner") or {}
          assert runner.get("uid") == os.getuid(), runner
          if data["status"] == "passed":
              # A pass must be a real unprivileged production-cgroup run, not a
              # root-only controller claim.
              assert data.get("profile") == "cgroup", data.get("profile")
              assert runner.get("uid") not in (None, 0), runner
              assert data.get("assertions"), "passing receipt has no executed assertions"
          evidence = data.get("evidence_dir")
          assert evidence, "receipt does not name its evidence directory"
          assert os.path.realpath(evidence).startswith(os.path.realpath(os.environ["RECEIPT_DIR"]))
          print("native receipt status:", data["status"])
          print("assertions:", ",".join(sorted(data.get("assertions", {}))))
          PY

      - name: Reclaim run-specific cgroup, mount, database and files
        if: always()
        timeout-minutes: 3
        run: |
          sudo scripts/native_kernel_cgroup_setup.sh cleanup "$GITHUB_RUN_ID" || true
          if mountpoint -q "$ROOTYARD_TEST_TMPFS_ROOT"; then
            sudo umount "$ROOTYARD_TEST_TMPFS_ROOT"
          fi
          sudo rm -rf "$ROOTYARD_TEST_TMPFS_ROOT"
          dropdb -h 127.0.0.1 -p 5432 -U rootyard --if-exists "$NATIVE_DB" || true

      - name: Upload sanitized native acceptance receipt and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kernel-cgroup-receipt-${{ github.run_id }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce acceptance result
        if: always()
        run: |
          if [ ! -s "$RECEIPT" ]; then
            echo "native receipt is missing: the acceptance produced no evidence" >&2
            exit 1
          fi
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "missing"))' "$RECEIPT")
          echo "native acceptance status: $status"
          # BLOCKED and FAILED both fail the job; only a real pass is accepted.
          test "$status" = "passed"

  # Opt-in sibling qualification.  It consumes the already attested build and
  # bubblewrap from the job above, owns its own run-specific PostgreSQL
  # database and private capture directory, and never rewrites the cgroup
  # acceptance or its evidence.  The dependency is the build artifact, not the
  # cgroup result: always() lets this job run even when the cgroup acceptance
  # fails after the build artifact was uploaded.  The default dispatch still
  # runs only the existing cgroup job.
  workspace-fuse-compat:
    name: Hosted FUSE compatibility witness
    needs: native-kernel-cgroup
    if: ${{ always() && inputs.fuse_compat }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          # Bootstrap database only.  The witness uses its own exact
          # run-specific database created below.
          POSTGRES_DB: rootyard_fuse_compat
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_fuse_compat"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ROOTYARD_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}
      PG_URL_BASE: postgresql://rootyard@127.0.0.1:5432
      FUSE_DB: rootyard_fuse_compat_${{ github.run_id }}_${{ github.run_attempt }}
      ROOTYARD_TEST_FUSE_COMPAT_WITNESS: "1"
      ROOTYARD_TEST_FUSE_BACKEND: fuse
      ROOTYARD_SANDBOX_MODE: dev
    steps:
      - name: Prepare private paths outside the checkout
        run: |
          echo "RECEIPT_DIR=$RUNNER_TEMP/workspace-fuse-compat" >>"$GITHUB_ENV"
          echo "RECEIPT=$RUNNER_TEMP/workspace-fuse-compat/receipt.json" >>"$GITHUB_ENV"
          echo "CLEANUP_RECEIPT=$RUNNER_TEMP/workspace-fuse-compat/cleanup.json" >>"$GITHUB_ENV"
          echo "PRIVATE_DIR=$RUNNER_TEMP/workspace-fuse-compat-private" >>"$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/workspace-fuse-compat-private/tmp" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/workspace-fuse-compat" \
            "$RUNNER_TEMP/workspace-fuse-compat-private/tmp"

      - name: Checkout the dispatched commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the project Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the attested build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-fuse-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuse-build

      - name: Install FUSE runtime and PostgreSQL 17 clients
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl fuse3 git gnupg libcap2 util-linux
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >>"$GITHUB_PATH"
          echo "$RUNNER_TEMP/fuse-build" >>"$GITHUB_PATH"
          fusermount3 --version
          psql --version

      - name: Verify the downloaded attested binary, receipt and bubblewrap
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/fuse-build"
          # Artifact transport is not relied on to preserve executable bits.
          chmod 0755 "$build_dir/rootyard" "$build_dir/bwrap"
          test -x "$build_dir/rootyard"
          test -f "$build_dir/rootyard.build.json"
          test -x "$build_dir/bwrap"
          (cd "$build_dir" && sha256sum -c SHA256SUMS)
          test "$("$build_dir/rootyard" --rootyard-hook-self-check)" = rootyard-hook-v1
          test "$(bwrap --version | awk '{print $2}')" != ""
          echo "ROOTYARD_BIN=$build_dir/rootyard" >>"$GITHUB_ENV"
          echo "ROOTYARD_BINARY=$build_dir/rootyard" >>"$GITHUB_ENV"
          echo "ROOTYARD_BUILD_RECEIPT=$build_dir/rootyard.build.json" >>"$GITHUB_ENV"
          sha256sum "$build_dir/rootyard" "$build_dir/rootyard.build.json" \
            >"$RECEIPT_DIR/build.sha256"

      - name: Bind the prebuilt binary to the dispatched source
        id: fuse_bind
        run: |
          python3 - "$ROOTYARD_BIN" "$GITHUB_SHA" "$RECEIPT_DIR/binding.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tests").resolve()))
          from runtime_binary import select_runtime_binary
          binary, binding = select_runtime_binary(
              {"ROOTYARD_BIN": sys.argv[1], "GITHUB_SHA": sys.argv[2]},
              root=Path.cwd(),
          )
          Path(sys.argv[3]).write_text(
              json.dumps({"binary": str(binary), "binding": binding},
                         indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("source-bound binary sha256:", binding["binary_sha256"])
          PY

      - name: Probe /dev/fuse and rootless namespaces
        id: fuse_preflight
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test -c /dev/fuse
          dev_fuse=$(stat -Lc '%F mode=%a' /dev/fuse)
          test "$(stat -Lc '%F' /dev/fuse)" = "character special file"
          unshare -Urm true
          unshare -Urm bwrap --unshare-all --die-with-parent --ro-bind / / \
            --size 1048576 --tmpfs /tmp -- /bin/true
          fusermount3 --version >"$PRIVATE_DIR/fusermount.txt"
          bwrap --version >"$PRIVATE_DIR/bwrap.txt"
          printf '%s\n' "$dev_fuse" >"$PRIVATE_DIR/dev-fuse.txt"
          printf '%s\n' "unshare -Urm: ok" >"$PRIVATE_DIR/unshare.txt"
          mkdir -p "$RECEIPT_DIR"
          cp -- "$PRIVATE_DIR/dev-fuse.txt" "$PRIVATE_DIR/unshare.txt" \
            "$PRIVATE_DIR/bwrap.txt" "$PRIVATE_DIR/fusermount.txt" "$RECEIPT_DIR/"

      - name: Create the exact run-specific PostgreSQL 17 database
        id: fuse_db
        if: steps.fuse_preflight.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          server_version=$(psql "$PG_URL_BASE/postgres" -tAc 'show server_version')
          case "$server_version" in
            17.*) ;;
            *)
              echo "unexpected PostgreSQL server version" >&2
              exit 1
              ;;
          esac
          createdb -h 127.0.0.1 -p 5432 -U rootyard "$FUSE_DB"
          test "$(psql "$PG_URL_BASE/$FUSE_DB" -tAc 'select current_database()')" = "$FUSE_DB"
          printf '%s\n' "$server_version" >"$RECEIPT_DIR/postgres-version.txt"
          printf '%s\n' "$FUSE_DB" >"$RECEIPT_DIR/database-name.txt"

      - name: Run the hosted FUSE compatibility witness
        id: fuse_test
        if: steps.fuse_preflight.outcome == 'success' && steps.fuse_db.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ROOTYARD_TEST_DATABASE_URL: ${{ env.PG_URL_BASE }}/${{ env.FUSE_DB }}
          ROOTYARD_BIN: ${{ env.ROOTYARD_BIN }}
          ROOTYARD_BINARY: ${{ env.ROOTYARD_BINARY }}
          ROOTYARD_BUILD_RECEIPT: ${{ env.ROOTYARD_BUILD_RECEIPT }}
          ROOTYARD_TEST_FUSE_COMPAT_WITNESS: "1"
          ROOTYARD_TEST_FUSE_BACKEND: fuse
          ROOTYARD_SANDBOX_MODE: dev
          ROOTYARD_SOURCE_COMMIT: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python3 tests/workspace_fuse_compat_witness.py -v \
            >"$PRIVATE_DIR/unittest.log" 2>&1
          test_status=$?
          set -e
          python3 scripts/workspace_fuse_compat_receipt.py \
            --output "$RECEIPT" \
            --raw-log "$PRIVATE_DIR/unittest.log" \
            --exit-code "$test_status" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --binary "$ROOTYARD_BIN" \
            --build-receipt "$ROOTYARD_BUILD_RECEIPT" \
            --harness tests/workspace_fuse_compat_witness.py \
            --workflow .github/workflows/native-kernel-acceptance.yml \
            --test-case test_detached_inert_lfs_checkpoint_remount_and_local_restore \
            --database-name "$FUSE_DB" \
            --pg-version "$(cat "$RECEIPT_DIR/postgres-version.txt" 2>/dev/null || true)" \
            --dev-fuse "$(cat "$RECEIPT_DIR/dev-fuse.txt" 2>/dev/null || true)" \
            --unshare-status "$(cat "$RECEIPT_DIR/unshare.txt" 2>/dev/null || true)" \
            --bwrap-status "$(cat "$RECEIPT_DIR/bwrap.txt" 2>/dev/null || true)" \
            --fusermount-version "$(cat "$RECEIPT_DIR/fusermount.txt" 2>/dev/null || true)"

      - name: Write a blocked or failed receipt when the witness did not run
        if: always()
        env:
          BIND_OUTCOME: ${{ steps.fuse_bind.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.fuse_preflight.outcome }}
          DB_OUTCOME: ${{ steps.fuse_db.outcome }}
        run: |
          mkdir -p "$RECEIPT_DIR"
          if [ -s "$RECEIPT" ]; then
            exit 0
          fi
          if [ "$BIND_OUTCOME" != "success" ]; then
            classification="build_artifact_or_binding_unavailable"
            blocked=
          elif [ "$PREFLIGHT_OUTCOME" != "success" ] || [ "$DB_OUTCOME" != "success" ]; then
            classification="fuse_preflight_or_database_unavailable"
            blocked=--blocked
          else
            classification="witness_process_exited_without_receipt"
            blocked=
          fi
          python3 scripts/workspace_fuse_compat_receipt.py \
            --output "$RECEIPT" \
            --raw-log "$PRIVATE_DIR/unittest.log" \
            --exit-code 1 \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --binary "${ROOTYARD_BIN:-}" \
            --build-receipt "${ROOTYARD_BUILD_RECEIPT:-}" \
            --harness tests/workspace_fuse_compat_witness.py \
            --workflow .github/workflows/native-kernel-acceptance.yml \
            --test-case test_detached_inert_lfs_checkpoint_remount_and_local_restore \
            --database-name "$FUSE_DB" \
            --pg-version "$(cat "$RECEIPT_DIR/postgres-version.txt" 2>/dev/null || true)" \
            --dev-fuse "$(cat "$RECEIPT_DIR/dev-fuse.txt" 2>/dev/null || true)" \
            --unshare-status "$(cat "$RECEIPT_DIR/unshare.txt" 2>/dev/null || true)" \
            --bwrap-status "$(cat "$RECEIPT_DIR/bwrap.txt" 2>/dev/null || true)" \
            --fusermount-version "$(cat "$RECEIPT_DIR/fusermount.txt" 2>/dev/null || true)" \
            --classification "$classification" $blocked

      - name: Reclaim the FUSE database and private capture
        if: always()
        timeout-minutes: 2
        run: |
          set +e
          mkdir -p "$RECEIPT_DIR"
          # Terminate only this run's database backends, then drop only that
          # exact database.  The URL itself is never printed or uploaded.
          psql "$PG_URL_BASE/postgres" -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$FUSE_DB' AND pid <> pg_backend_pid()" \
            >/dev/null 2>&1
          dropdb -h 127.0.0.1 -p 5432 -U rootyard --if-exists "$FUSE_DB"
          db_status=$?
          timeout 20s rm -rf -- "$PRIVATE_DIR"
          private_status=$?
          # The next steps must not inherit a removed private TMPDIR.
          echo "TMPDIR=/tmp" >>"$GITHUB_ENV"
          python3 - "$CLEANUP_RECEIPT" "$db_status" "$private_status" <<'PY'
          import json
          import sys
          from pathlib import Path
          db_status = int(sys.argv[2])
          private_status = int(sys.argv[3])
          payload = {
              "schema": "rootyard/workspace-fuse-compat-cleanup/v1",
              "status": "passed" if db_status == 0 and private_status == 0 else "failed",
              "database_dropped": db_status == 0,
              "private_tree_removed": private_status == 0,
              "database_url_retained": False,
              "raw_unittest_output_retained": False,
          }
          Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("fuse compat cleanup:", payload["status"])
          PY

      - name: Upload sanitized FUSE compatibility receipt
        if: always() && inputs.fuse_compat
        uses: actions/upload-artifact@v4
        with:
          name: workspace-fuse-compat-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce the FUSE compatibility result
        if: always() && inputs.fuse_compat
        run: |
          if [ ! -s "$RECEIPT" ]; then
            echo "FUSE receipt is missing: the witness produced no evidence" >&2
            exit 1
          fi
          python3 - "$RECEIPT" "$CLEANUP_RECEIPT" <<'PY'
          import json
          import os
          import subprocess
          import sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          cleanup = json.load(open(sys.argv[2], encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          checks = {
              "schema": receipt.get("schema") == "rootyard/workspace-fuse-compat-receipt/v1",
              "status": receipt.get("status") == "passed",
              "source_commit": receipt.get("source_commit") == os.environ.get("GITHUB_SHA"),
              "source_tree": receipt.get("source_tree") == head,
              "tests_run": receipt.get("tests_run") == 1,
              "skipped": receipt.get("skipped") == 0,
              "failures": receipt.get("failures") == 0,
              "errors": receipt.get("errors") == 0,
              "selected": receipt.get("expected_case_selected") is True,
              "case_ok": receipt.get("case_outcome") == "ok",
              "binary": isinstance(receipt.get("binary_sha256"), str),
              "build_receipt": isinstance(receipt.get("build_receipt_sha256"), str),
              "harness": isinstance(receipt.get("harness_sha256"), str),
              "workflow": isinstance(receipt.get("workflow_sha256"), str),
              "gate": receipt.get("selection", {}).get("gate") == "ROOTYARD_TEST_FUSE_COMPAT_WITNESS=1",
              "backend": receipt.get("selection", {}).get("backend") == "ROOTYARD_TEST_FUSE_BACKEND=fuse",
              "cleanup": cleanup.get("status") == "passed",
          }
          failed = sorted(name for name, ok in checks.items() if not ok)
          print("FUSE compatibility receipt status:", receipt.get("status"))
          print("checks:", ",".join(name for name in checks if checks[name]))
          if failed:
              print("failed checks:", ",".join(failed), file=sys.stderr)
              raise SystemExit(1)
          print("FUSE compatibility witness passed: 1 test, 0 skipped")
          PY
