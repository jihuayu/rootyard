name: Native kernel cgroup acceptance

# Manual feature acceptance only. This is intentionally not part of ordinary
# push/pull_request CI: it needs a cgroup v2 VM with root delegation and a
# disposable PostgreSQL service.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-kernel-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-kernel-cgroup:
    name: Delegated cgroup v2 native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_DB: rootyard_native
          # Ephemeral isolated service; no repository secret is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_native"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RECEIPT_DIR: ${{ runner.temp }}/native-kernel
      RECEIPT: ${{ runner.temp }}/native-kernel/receipt.json
      ROOTYARD_TEST_CGROUP_ROOT: /sys/fs/cgroup/rootyard-native-${{ github.run_id }}
      ROOTYARD_TEST_TMPFS_ROOT: ${{ runner.temp }}/rootyard-native-pool-${{ github.run_id }}
      ROOTYARD_SANDBOX_MODE: cgroup
      ROOTYARD_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}
      TMPDIR: /tmp
      PG_URL_BASE: postgresql://rootyard@127.0.0.1:5432
      SERVICE_DB: rootyard_sandbox_service_${{ github.run_id }}_${{ github.run_attempt }}
      NATIVE_DB: rootyard_native_cgroup_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native sandbox toolchain
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap gcc libc6-dev git python3 postgresql-client util-linux
          bwrap --version
          gcc --version | head -1
          psql --version
          rustc --version
          cargo --version

      - name: Build actual production binary from locked source
        timeout-minutes: 20
        run: |
          cargo build --locked --bin rootyard
          test -x target/debug/rootyard
          test "$(target/debug/rootyard --rootyard-hook-self-check)" = rootyard-hook-v1

      - name: Run production cgroup validator unit tests
        timeout-minutes: 10
        run: cargo test --locked --lib sandbox::cgroup

      - name: Delegate run-specific cgroup and mount bounded tmpfs
        id: native_setup
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RECEIPT_DIR"
          sudo scripts/native_kernel_cgroup_setup.sh setup "$GITHUB_RUN_ID"
          sudo mkdir -p "$ROOTYARD_TEST_TMPFS_ROOT"
          sudo mount -t tmpfs -o size=64m,mode=0700,nodev,nosuid,noexec tmpfs "$ROOTYARD_TEST_TMPFS_ROOT"
          capacity=$(sudo python3 -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$ROOTYARD_TEST_TMPFS_ROOT")
          test "$capacity" -gt 0
          echo "ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES=$capacity" >>"$GITHUB_ENV"

      - name: Create one disposable database per native test script
        if: steps.native_setup.outcome == 'success'
        timeout-minutes: 2
        run: |
          createdb -h 127.0.0.1 -p 5432 -U rootyard "$SERVICE_DB"
          createdb -h 127.0.0.1 -p 5432 -U rootyard "$NATIVE_DB"

      - name: Exercise dev-mode sandbox lifecycle regression
        if: steps.native_setup.outcome == 'success'
        timeout-minutes: 15
        run: |
          PYTHONPATH="$PWD" \
          ROOTYARD_BINARY="$PWD/target/debug/rootyard" \
          ROOTYARD_TEST_DATABASE_URL="$PG_URL_BASE/$SERVICE_DB" \
          python3 tests/test_sandbox_service.py

      - name: Run native cgroup acceptance in a supervisor leaf
        id: native_test
        if: steps.native_setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo -E env \
            ROOTYARD_BINARY="$PWD/target/debug/rootyard" \
            ROOTYARD_TEST_DATABASE_URL="$PG_URL_BASE/$NATIVE_DB" \
            ROOTYARD_TEST_CGROUP_ROOT="$ROOTYARD_TEST_CGROUP_ROOT" \
            ROOTYARD_TEST_TMPFS_ROOT="$ROOTYARD_TEST_TMPFS_ROOT" \
            ROOTYARD_SANDBOX_MODE=cgroup \
            ROOTYARD_SOURCE_COMMIT="$GITHUB_SHA" \
            ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES="$ROOTYARD_TEST_ARTIFACTS_POOL_MAX_BYTES" \
            PYTHONPATH="$PWD" \
            ROOTYARD_NATIVE_RECEIPT="$RECEIPT" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            TMPDIR=/tmp \
            sh -c 'scripts/native_kernel_cgroup_setup.sh supervisor "$GITHUB_RUN_ID" && exec python3 tests/test_sandbox_cgroup_native.py --receipt "$RECEIPT"'

      - name: Write or validate sanitized native receipt
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.native_setup.outcome }}
          TEST_OUTCOME: ${{ steps.native_test.outcome }}
        run: |
          mkdir -p "$RECEIPT_DIR"
          if [ ! -s "$RECEIPT" ]; then
            python3 - "$RECEIPT" <<'PY'
          import hashlib, json, os, sys, time
          def digest(path):
              try:
                  h = hashlib.sha256()
                  with open(path, "rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          h.update(chunk)
                  return h.hexdigest()
              except OSError:
                  return None
          reason = "native assertion process did not write a receipt"
          if os.environ.get("SETUP_OUTCOME") != "success":
              reason = "cgroup delegation/tmpfs setup did not complete"
          elif os.environ.get("TEST_OUTCOME") == "failure":
              reason = "native cgroup test process exited without a receipt"
          receipt = {
              "schema": "rootyard/native-kernel-cgroup-receipt/v1",
              "status": "blocked",
              "profile": "cgroup",
              "source_commit": os.environ.get("ROOTYARD_SOURCE_COMMIT") or os.environ.get("GITHUB_SHA"),
              "binary_sha256": digest("target/debug/rootyard"),
              "test_file_sha256": digest("tests/test_sandbox_cgroup_native.py"),
              "workflow_file_sha256": digest(".github/workflows/native-kernel-acceptance.yml"),
              "preflight": {"reason": reason},
              "assertions": {},
              "generated_unix": int(time.time()),
          }
          open(sys.argv[1], "w").write(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          fi
          python3 - "$RECEIPT" <<'PY'
          import hashlib, json, os, sys
          data = json.load(open(sys.argv[1]))
          assert data.get("schema") == "rootyard/native-kernel-cgroup-receipt/v1"
          assert data.get("status") in ("passed", "failed", "blocked")
          assert data.get("source_commit") == os.environ.get("GITHUB_SHA")
          test_sha = hashlib.sha256(open("tests/test_sandbox_cgroup_native.py", "rb").read()).hexdigest()
          assert data.get("test_file_sha256") == test_sha
          print("native receipt status:", data["status"])
          print("assertions:", ",".join(sorted(data.get("assertions", {}))))
          PY

      - name: Reclaim run-specific cgroup, mount, databases and files
        if: always()
        timeout-minutes: 3
        run: |
          sudo scripts/native_kernel_cgroup_setup.sh cleanup "$GITHUB_RUN_ID" || true
          if mountpoint -q "$ROOTYARD_TEST_TMPFS_ROOT"; then
            sudo umount "$ROOTYARD_TEST_TMPFS_ROOT"
          fi
          sudo rm -rf "$ROOTYARD_TEST_TMPFS_ROOT"
          dropdb -h 127.0.0.1 -p 5432 -U rootyard --if-exists "$SERVICE_DB" || true
          dropdb -h 127.0.0.1 -p 5432 -U rootyard --if-exists "$NATIVE_DB" || true

      - name: Upload sanitized native acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kernel-cgroup-receipt-${{ github.run_id }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce acceptance result
        if: always()
        run: |
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "missing"))' "$RECEIPT")
          test "$status" = "passed"
