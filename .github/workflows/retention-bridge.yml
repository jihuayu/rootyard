name: Retention Bridge Acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: retention-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGOFORK_VERSION: 1.101.0
  CARGOFORK_COMMIT: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b

jobs:
  retention-bridge:
    name: Retention Bridge Acceptance (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rootyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rootyard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/rootyard_test
      ROOTYARD_TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/rootyard_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1 toolchain (rustfmt + clippy)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Install and verify CargoFork (1.101.0)
        run: |
          bash scripts/install_ci_cargo_fork.sh install
          bash scripts/install_ci_cargo_fork.sh verify
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: retention-bridge-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            retention-bridge-${{ runner.os }}-

      - name: Verify formatting and design docs
        run: |
          cargo fmt --all -- --check
          python3 scripts/check_design_docs.py

      - name: Run Python bridge structural contracts
        run: |
          python3 -m unittest tests.test_retention_bridge_contracts -v

      - name: Run clippy with -D warnings
        run: |
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run artifact-hold and bridge unit tests
        run: |
          cargo test --locked --lib ref_store::core::artifact_hold

      - name: Run PG17 retention bridge integration acceptance
        run: |
          cargo test --locked --test ref_store_retention_bridge -- --ignored --test-threads=1
