name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: rust:1-trixie
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_PASSWORD: rootyard-ci-only
          POSTGRES_DB: rootyard_test
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard:rootyard-ci-only@postgres:5432/rootyard_test
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install matching PostgreSQL client and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git python3 postgresql-client-17 redis-server openjdk-21-jre-headless curl ca-certificates
      - name: Prepare verified isolated Kafka distribution
        run: |
          curl -fsSL --retry 3 https://downloads.apache.org/kafka/4.4.0/kafka_2.13-4.4.0.tgz -o /tmp/rootyard-kafka.tgz
          echo "f5ceba8a265ab6bb2d68362b1f6859a95e15d60ef92ba83b43fdf065b557dc18e98d6383c15b9977320e25b3a2c8b6f11decb17b0fa6c0f163423793a0eb95cb  /tmp/rootyard-kafka.tgz" | sha512sum -c -
          tar -xzf /tmp/rootyard-kafka.tgz -C /tmp
      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          git --version
          python3 --version
          psql --version
          pg_dump --version
          redis-server --version
          java -version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Verify durable PostgreSQL workers
        run: cargo test --locked --test outbox --test resolution_fences -- --ignored
      - run: cargo build --locked
      - name: Exercise native Git end to end
        run: python3 tests/e2e.py --binary target/debug/rootyard --report test-results/e2e.json
      - name: Exercise durable push recovery
        run: python3 tests/reliability.py --binary target/debug/rootyard --report test-results/reliability.json
      - name: Exercise explicit recovery and metrics
        run: |
          python3 tests/recovery_ops.py --binary target/debug/rootyard --report test-results/recovery-ops.json
          python3 tests/metrics.py --binary target/debug/rootyard --report test-results/metrics.json
      - name: Exercise cross-process delivery
        run: ROOTYARD_TEST_REDIS_SERVER=/usr/bin/redis-server python3 tests/cross_process.py --binary target/debug/rootyard --report test-results/cross-process.json
      - name: Exercise real Kafka advisory wakes
        run: ROOTYARD_TEST_KAFKA_HOME=/tmp/kafka_2.13-4.4.0 python3 tests/kafka_wakes.py --binary target/debug/rootyard --report test-results/kafka.json
      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/*.json
          if-no-files-found: ignore

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container with native Kafka client
        run: docker build --tag rootyard:ci .
