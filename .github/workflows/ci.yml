name: CI
# pull_request is the single full gate for a PR head; an unfiltered `push:`
# ran the same verify/container checks a second time for the same commit
# (e.g. push 42783486160 vs pull_request 42783651096 for PR #191). push is
# limited to main, the only long-lived branch (no release/maintenance branches
# or tags exist), so the post-merge gate on main stays complete. No paths:
# filter, so required checks can never be left permanently pending.
# See docs/acceptance/ci-trigger-dedup-20261110.md.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Plain Ubuntu 22.04 host profile, matching the target on which the manual
    # native-kernel-acceptance workflow passed its 17 assertions. There is no
    # container init process: PID 1 is the runner host's init, which adopts and
    # reaps orphaned Git grandchildren. Do not introduce a global child
    # subreaper or relax AppArmor/LSM policy to compensate for a missing init.
    runs-on: ubuntu-22.04
    # Job cap for this branch's 159-minute verify/lifecycle budget (119 from
    # common main plus 40 for the package gates), plus #304's independent
    # 12-minute cold tenant LFS gate on owned Garage: 159 + 12 = 171 minutes.
    # The common 24-minute Redis allowance is already inside the 119 and is
    # not added again.
    timeout-minutes: 171
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_PASSWORD: rootyard-ci-only
          POSTGRES_DB: rootyard_test
        # Publish the service on the host at a fixed loopback port. The
        # container service itself is ephemeral and uses a CI-only password.
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard:rootyard-ci-only@127.0.0.1:55432/rootyard_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the project Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CI toolchain (postgresql-17 postgresql-client-17, Git 2.43, bubblewrap --size, FUSE, LFS)
        timeout-minutes: 20
        run: |
          scripts/install_ci_native_tools.sh install \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/ci-native-tools/provenance.json
      - name: Verify native CI tool profile
        timeout-minutes: 5
        run: |
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "PG_SHARE=/usr/share/postgresql/17" >> "$GITHUB_ENV"
          scripts/install_ci_native_tools.sh preflight \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/ci-native-tools/provenance.json
      - name: Install pinned Rust 1.99.1 gate tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc -V && cargo -V && rustfmt -V && cargo clippy -V
      - name: Restore the pinned CargoFork executable
        uses: actions/cache@v4
        with:
          # Cache only the fork executable. The fork keeps one shared compiler
          # cache in ~/.cargo/targets per runner/worktree; do not add a
          # per-commit CARGO_TARGET_DIR or clone a target tree here. The job id
          # keeps a Debian trixie container binary out of an Ubuntu host cache.
          path: ${{ runner.temp }}/rootyard-cargo-fork
          key: rootyard-cargo-fork-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b-1.99.1-v1
      - name: Install pinned CargoFork 1.101.0 (full 64a6ee6a)
        run: |
          scripts/install_ci_cargo_fork.sh install \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --record test-results/ci-cargo-fork.json
      - name: Verify CargoFork 64a6ee6a before Cargo
        run: |
          scripts/install_ci_cargo_fork.sh verify \
            --cache-dir "$RUNNER_TEMP/rootyard-cargo-fork" \
            --require-os linux \
            --require-path
          cargo -vV
          cargo -vV | grep -Fx 'release: 1.101.0'
          cargo -vV | grep -Fx 'commit-hash: 64a6ee6a47acfa82b1ed930d7cd55e56dc30c30b'
          rustc -V | grep -Eq '^rustc 1\.99\.1 '
      - name: Test bounded Kafka download helper
        run: python3 -m unittest discover -s tests -p 'test_download_ci_kafka.py'
      - name: Prepare verified isolated Kafka distribution
        timeout-minutes: 5
        run: |
          python3 scripts/download_ci_kafka.py test-results/ci-tools/rootyard-kafka.tgz
          tar -xzf test-results/ci-tools/rootyard-kafka.tgz -C test-results/ci-tools
      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          git --version
          git lfs version
          bwrap --version
          unshare --version
          fusermount3 --version
          python3 --version
          psql --version
          pg_dump --version
          initdb --version
          pg_ctl --version
          redis-server --version
          java -version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features pando-lab -- -D warnings
      - run: cargo test --locked --all-targets --features pando-lab
      - name: Verify durable PostgreSQL workers
        run: cargo test --locked --features pando-lab --test outbox --test resolution_fences -- --ignored
      - name: Verify PostgreSQL RefStore registry and metadata-core contracts
        timeout-minutes: 5
        run: cargo test --locked --features pando-lab --test ref_store_operations --test ref_store_core --test ref_store_core_snapshot --test ref_store_artifact_holds --test ref_cas_event_projection -- --ignored --test-threads=1
      - name: Build relocated rootyard library test harness for the PostgreSQL start gate
        timeout-minutes: 10
        run: |
          python3 scripts/build_native_test.py \
            --lib \
            --features pando-lab \
            --strip-debuginfo \
            --artifact-store "$HOME/.cache/rootyard/native-artifacts" \
            --output test-results/rootyard-lib-tests
      - name: Verify managed PostgreSQL sandbox start-gate lock order
        timeout-minutes: 10
        run: |
          python3 scripts/run_pg_start_gate.py \
            --test-binary test-results/rootyard-lib-tests \
            --build-receipt test-results/rootyard-lib-tests.build.json \
            --report test-results/pg-start-gate.json \
            --expected-commit "$GITHUB_SHA"
          python3 scripts/native_report_manifest.py --mode job \
            --manifest-out test-results/native-pg-start-gate.json \
            --build-receipt test-results/rootyard-lib-tests.build.json \
            --binary test-results/rootyard-lib-tests \
            --expect-commit "$GITHUB_SHA" \
            --report pg_start_gate=test-results/pg-start-gate.json \
            --require-case pg_start_gate=sandbox::runner::tests::start_gate_serializes_context_removal_under_policy_fence \
            --harness scripts/run_pg_start_gate.py \
            --harness tests/test_pg_start_gate_runner.py \
            --harness src/sandbox/runner.rs \
            --harness scripts/build_native_test.py \
            --harness scripts/build_native.py \
            --harness scripts/native_report_manifest.py \
            --harness scripts/native_build_receipt.py \
            --harness .github/workflows/ci.yml
      - name: Build native bins and RefStore fixtures in one batch
        timeout-minutes: 10
        run: |
          python3 scripts/build_native_batch.py \
            --all-bins \
            --features pando-lab \
            --strip-debuginfo \
            --test ref_store_snapshot_backup_fixture \
            --output test-results/refstore-snapshot-fixture \
            --test ref_store_holds_backup_fixture \
            --output test-results/refstore-holds-fixture \
            --manifest-out test-results/native-build-batch.json \
            --artifact-store "$HOME/.cache/rootyard/native-artifacts"
      - name: Export immutable native artifact paths
        run: |
          python3 scripts/export_native_artifacts.py \
            --manifest test-results/native-build-batch.json \
            --github-env "$GITHUB_ENV" \
            --bin rootyard=ROOTYARD_BIN \
            --bin rootyard-workspace-lab=ROOTYARD_WORKSPACE_LAB_BIN \
            --bin rootyard-view-lab=ROOTYARD_VIEW_LAB_BIN \
            --bin rootyard-pando-lab=ROOTYARD_PANDO_LAB_BIN \
            --bin rootyard-vfs-mount=ROOTYARD_VFS_MOUNT_BIN \
            --bin-receipt rootyard=ROOTYARD_BUILD_RECEIPT \
            --bin-receipt rootyard-pando-lab=ROOTYARD_PANDO_BUILD_RECEIPT \
            --test ref_store_snapshot_backup_fixture=ROOTYARD_SNAPSHOT_FIXTURE \
            --test ref_store_holds_backup_fixture=ROOTYARD_HOLDS_FIXTURE
      - name: Run the 17 ignored Pando Local PostgreSQL producer cases
        timeout-minutes: 10
        run: |
          python3 scripts/run_pando_producer_pg.py \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-commit "$GITHUB_SHA" \
            --product-receipt "$ROOTYARD_PANDO_BUILD_RECEIPT" \
            --report test-results/pando-producer-pg.json \
            --timeout-seconds 540
      - name: Exercise trusted CI HTTP authority boundaries
        timeout-minutes: 10
        run: python3 tests/ci_trust_boundaries.py --binary "$ROOTYARD_BIN" --report test-results/ci-trust-boundaries.json --expected-commit "$GITHUB_SHA"
      - name: Verify design documentation integrity
        run: python3 scripts/check_design_docs.py
      - name: Verify schema-030 catalog and dump round trip
        run: python3 tests/schema_contract.py --binary "$ROOTYARD_BIN"
      - name: Verify end-to-end harness synchronization
        run: python3 -m unittest discover -s tests -p 'test_e2e_sync.py'
      - name: Reject missing executables and non-server stubs
        run: python3 -m unittest discover -s tests -p 'test_native_entrypoint.py'
      - name: Prepare pinned independent Git clients
        run: |
          python3 scripts/prepare_git_clients.py test-results/ci-tools/clients
          python3 -m venv test-results/ci-tools/client-venv
          test-results/ci-tools/client-venv/bin/pip install pygit2==1.19.0 cffi==2.1.1 pycparser==3.12
      - name: Exercise stock Git, JGit and libgit2 against the Rust service
        run: |
          ROOTYARD_JGIT_CLASSPATH="$PWD/test-results/ci-tools/clients/jgit-libs/*" ROOTYARD_PYGIT2_PYTHON="$PWD/test-results/ci-tools/client-venv/bin/python" python3 tests/client_compatibility.py --binary "$ROOTYARD_BIN" --report test-results/client-compatibility.json
      - name: Verify parallel track and schema baseline boundaries
        run: python3 -m unittest discover -s tests -p 'test_parallel_boundaries.py'
      - name: Install Python CI test requirements
        run: python3 -m pip install -r tests/requirements-python-ci.txt
      - name: Exercise repository archive, rename aliases, soft-delete purge, and ownership transfer (#85)
        timeout-minutes: 10
        run: python3 tests/repository_lifecycle.py --binary "$ROOTYARD_BIN" --report test-results/repository-lifecycle.json
      - name: "Qualify #85 cold tenant LFS retention on owned Garage"
        timeout-minutes: 12
        run: |
          set -euo pipefail
          umask 077
          final_report="test-results/repository-lifecycle-remote-tenant-lfs.json"
          [[ ! -e "$final_report" && ! -L "$final_report" ]]
          scratch="$(mktemp -d "$RUNNER_TEMP/issue85-tenant-lfs.XXXXXX")"
          garage_dir="$scratch/garage"
          object_store_env="$scratch/object-store.env"
          staged_report="$scratch/report.json"
          fixture_started=0
          finalize() {
            local status=$?
            trap - EXIT
            if [[ "$fixture_started" == 1 && ! -d "$garage_dir" ]] ||
               ! scripts/owned_garage_fixture.sh stop --directory "$garage_dir" >/dev/null 2>&1 ||
               [[ -e "$garage_dir" || -L "$garage_dir" || -e "$object_store_env" || -L "$object_store_env" ]]; then
              echo "Owned Garage cleanup failed." >&2
              exit 1
            fi
            rm -f -- "$staged_report"
            rmdir -- "$scratch"
            if [[ "$status" == 0 ]]; then
              printf '%s\n' "$report_json" >"$final_report"
            fi
            exit "$status"
          }
          trap finalize EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ROOTYARD_FIXTURE_PULL_TIMEOUT=120 scripts/owned_garage_fixture.sh start \
            --directory "$garage_dir" --output-env "$object_store_env" \
            --bucket-prefix rootyard-issue85-lfs >/dev/null 2>&1
          fixture_started=1
          (
            set -a
            source "$object_store_env"
            set +a
            timeout --signal=INT --kill-after=15 240 python3 tests/repository_lifecycle.py \
              --remote-tenant-lfs --binary "$ROOTYARD_BIN" --report "$staged_report"
          ) >/dev/null 2>&1
          [[ -f "$staged_report" && ! -L "$staged_report" && -s "$staged_report" ]]
          report_json="$(<"$staged_report")"
      - name: Exercise deleted webhook-claim fence (#85)
        timeout-minutes: 10
        run: ROOTYARD_EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" python3 tests/repository_lifecycle_deleted_claim_acceptance.py --binary "$ROOTYARD_BIN" --report test-results/repository-lifecycle-deleted-claim.json
      - name: Exercise literal Issue 85 purge-hold and alias acceptance
        timeout-minutes: 10
        run: python3 tests/repository_lifecycle_acceptance.py --binary "$ROOTYARD_BIN" --build-receipt "$ROOTYARD_BUILD_RECEIPT" --expected-source-commit "$GITHUB_SHA" --report test-results/repository-lifecycle-issue85-literal.json
      - name: Run all Python unit and Tier-5 adversarial contract suites
        # Full discovery stays unfiltered; the runner adds per-test progress and
        # periodic stderr thread stacks without changing exit semantics.
        env:
          ROOTYARD_PYTHON_CI_REPORT: ${{ github.event.pull_request.number == 283 && 'test-results/python-ci-result.json' || '' }}
        run: |
          report_args=()
          if [[ -n "$ROOTYARD_PYTHON_CI_REPORT" ]]; then
            report_args=(--report-out "$ROOTYARD_PYTHON_CI_REPORT" --expected-commit="${GITHUB_SHA:-}")
          fi
          python3 scripts/run_python_ci_tests.py "${report_args[@]}"
      - name: Exercise native Git end to end
        run: python3 tests/e2e.py --binary "$ROOTYARD_BIN" --report test-results/e2e.json
      - name: Exercise exact-commit CI read mirror
        run: python3 tests/ci_mirror.py --binary "$ROOTYARD_BIN" --report test-results/ci-mirror.json
      - name: Exercise exact-target source retention and mirror preparation
        run: python3 tests/ci_source_pins.py --binary "$ROOTYARD_BIN" --report test-results/ci-source-pins.json
      - name: Verify browse cache incarnation across restore with owned Redis
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "${RUNNER_TEMP:?}/rootyard-browse-restore.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          binary="$scratch/browse-restore-rootyard"
          receipt="$binary.build.json"
          published_receipt="test-results/${receipt##*/}"
          report="$scratch/browse-restore-cache.json"
          manifest="$scratch/native-browse-restore-cache.json"
          partition_report="$scratch/redis-wake-partition.json"
          partition_manifest="$scratch/native-redis-wake-partition.json"
          restore_case=browse_restore_incarnation_cache
          flush_case=browse_flushall_preserves_git_authority
          partition_case=real_redis_partition_pg_fallback_and_wake
          tree=$(git rev-parse 'HEAD^{tree}')

          publish_failure() {
            python3 -I - "$1" "$2" "$GITHUB_SHA" >/dev/null 2>&1 <<'PY' || :
          import json
          from pathlib import Path
          import re
          import sys

          source_path, mode, head = sys.argv[1:]
          filename, name, stages = {
              "restore": ("browse-restore-cache-failure.json", "browse_flushall_preserves_git_authority",
                          {"source_warm_backup", "restore", "restored_preview", "flush_authority"}),
              "partition": ("redis-wake-partition-failure.json", "real_redis_partition_pg_fallback_and_wake",
                            {"fixture", "partition"}),
          }[mode]
          with Path(source_path).open("rb") as source:
              raw = source.read(4097)
          assert 0 < len(raw) <= 4096
          report = json.loads(raw)
          basic = {"passed", "cases"}
          hashes = {"source_tree": 40, "source_inputs_sha256": 64,
                    "binary_sha256": 64, "build_receipt_sha256": 64}
          assert set(report) in (basic, basic | {"source_head", *hashes})
          if "source_head" in report:
              assert report["source_head"] == head
              assert all(re.fullmatch(rf"[0-9a-f]{{{size}}}", report[key]) for key, size in hashes.items())
          assert report["passed"] is False
          case, = report["cases"]
          assert set(case) == {"name", "status", "error"}
          assert case["name"] == name and case["status"] == "failed"
          assert case["error"] in stages | {"preflight", "receipt_changed", "cleanup", "report_write"}
          with (Path("test-results") / filename).open("x") as output:
              json.dump({"passed": False, "cases": [case]}, output)
          PY
          }

          write_manifest() {
            local proof=$1
            shift
            test -s "$proof" && test "$(wc -c < "$proof")" -le 4096 &&
              python3 scripts/native_report_manifest.py --mode job \
                --binary "$binary" --expect-commit "$GITHUB_SHA" --fixture postgres=postgres:17 \
                --harness tests/backup_recovery_cache.py \
                --harness tests/cross_process.py \
                --harness tests/e2e.py \
                --harness tests/native_evidence.py \
                --harness tests/owned_fuse_cleanup.py \
                --harness scripts/build_native.py \
                --harness scripts/native_artifact_store.py \
                --harness scripts/native_build_receipt.py \
                --harness scripts/native_report_manifest.py \
                --harness .github/workflows/ci.yml "$@" >/dev/null 2>&1
          }

          verify_proof_binding() {
            python3 -I - "$tree" "$@" >/dev/null 2>&1 <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          tree, manifest_path, report_path, label, *expected = sys.argv[1:]
          manifest = json.loads(Path(manifest_path).read_bytes())
          payload = Path(report_path).read_bytes()
          report = json.loads(payload)
          cases = report["cases"]
          assert [case["name"] for case in cases] == expected
          assert all(case["detail"]["owned_cleanup_completed"] is True for case in cases)
          assert set(manifest["reports"]) == {label}
          entry = manifest["reports"][label]
          assert entry["case_names"] == expected and entry["sha256"] == hashlib.sha256(payload).hexdigest()
          assert report["source_head"] == manifest["source_commit"] and report["source_tree"] == tree
          assert report["source_inputs_sha256"] == manifest["source_inputs_sha256"]
          assert report["binary_sha256"] == manifest["binary_sha256"]
          assert report["build_receipt_sha256"] == manifest["build_receipt"]["sha256"]
          PY
          }

          if ! timeout --kill-after=30s 13m env -u CARGO_BUILD_JOBS python3 scripts/build_native.py \
            --features state-redis \
            --strip-debuginfo \
            --artifact-store "$HOME/.cache/rootyard/native-artifacts" \
            --output "$binary" >/dev/null 2>&1; then
            echo 'Browse restore CLI build failed'
            exit 1
          fi
          if ! ROOTYARD_TEST_REDIS_SERVER=/usr/bin/redis-server TMPDIR="$scratch" \
            timeout --kill-after=30s 5m python3 tests/backup_recovery.py \
              --browse-flush-authority --binary "$binary" --expect-commit "$GITHUB_SHA" \
              --report "$report" >/dev/null 2>&1; then
            publish_failure "$report" restore
            echo 'Browse restore or flush cache proof failed'
            exit 1
          fi
          if ! write_manifest "$report" \
            --manifest-out "$manifest" --build-receipt "$receipt" \
            --report "browse_restore_cache=$report" \
            --require-case "browse_restore_cache=$restore_case" \
            --require-case "browse_restore_cache=$flush_case" \
            --harness tests/backup_recovery.py \
            --harness tests/backup.py \
            --harness tests/schema_baseline.py \
            --harness schema/142_catalog.json \
            --harness schema/143_catalog.json \
            --harness schema/151_catalog.json; then
            echo 'Browse restore native manifest failed'
            exit 1
          fi
          if ! verify_proof_binding "$manifest" "$report" browse_restore_cache "$restore_case" "$flush_case"; then
            echo 'Browse restore cleanup or receipt binding failed'
            exit 1
          fi

          # Keep the adjacent receipt for the shared CLI and publish the verified
          # restore evidence before the partition drill can fail.
          cp -- "$receipt" "$published_receipt"
          mv -- "$report" "$manifest" test-results/

          if ! ROOTYARD_TEST_REDIS_SERVER=/usr/bin/redis-server TMPDIR="$scratch" \
            timeout --kill-after=30s 3m python3 tests/cross_process_partition.py \
              --binary "$binary" --expect-commit "$GITHUB_SHA" --report "$partition_report" >/dev/null 2>&1; then
            publish_failure "$partition_report" partition
            echo 'Redis wake partition proof failed'
            exit 1
          fi
          if ! write_manifest "$partition_report" \
            --manifest-out "$partition_manifest" --build-receipt "$published_receipt" \
            --report "redis_wake_partition=$partition_report" \
            --require-case "redis_wake_partition=$partition_case" \
            --harness tests/cross_process_partition.py \
            --harness tests/redis_partition_relay.py; then
            echo 'Redis wake partition native manifest failed'
            exit 1
          fi
          if ! verify_proof_binding "$partition_manifest" "$partition_report" redis_wake_partition "$partition_case"; then
            echo 'Redis wake partition cleanup or receipt binding failed'
            exit 1
          fi
          mv -- "$partition_report" "$partition_manifest" test-results/
          rm -rf -- "$scratch"
          test ! -e "$scratch"
          trap - EXIT INT TERM
      - name: Exercise isolated job checkout authorization and object closure
        run: python3 tests/ci_job_checkouts.py --binary "$ROOTYARD_BIN" --report test-results/ci-job-checkouts.json
      - name: Exercise exact pinned dependency checkout and origin fallback boundaries
        timeout-minutes: 20
        run: python3 tests/ci_dependencies.py --binary "$ROOTYARD_BIN" --report test-results/ci-dependencies.json
      - name: Build frozen schema007 binary for genuine legacy restore
        run: |
          legacy=08b10e9976c012343c48e4fd6a5981e0266b8c53
          workspace="$PWD"
          umask 077
          mkdir -p "$workspace/target"
          legacy_root=$(mktemp -d "$workspace/target/legacy-source.XXXXXX")
          trap 'rm -rf "$legacy_root"' EXIT
          mkdir "$legacy_root/home" "$legacy_root/repo"
          # Never invoke Git against the inherited checkout or inherit its config.
          git_owned() {
            env -i PATH="$PATH" HOME="$legacy_root/home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_TERMINAL_PROMPT=0 timeout 180 git -C "$legacy_root/repo" "$@"
          }
          git_owned init --template=
          git_owned fetch --no-tags --depth=1 https://github.com/jihuayu/rootyard.git "$legacy"
          test "$(git_owned rev-parse --verify 'FETCH_HEAD^{commit}')" = "$legacy"
          git_owned checkout --detach "$legacy"
          test "$(git_owned rev-parse --verify HEAD)" = "$legacy"
          (
            cd "$legacy_root/repo"
            # Output uplift only: CargoFork keeps the shared compiler cache in
            # ~/.cargo/targets and writes this frozen legacy binary here. Do not
            # copy a target tree per commit.
            CARGO_TARGET_DIR="$workspace/target/legacy-build" cargo build --locked --manifest-path Cargo.toml --bin rootyard
          )
          cp "$workspace/target/legacy-build/debug/rootyard" "$workspace/target/rootyard-schema007"
      - name: Exercise checkout backup revocation and genuine schema007 restore
        run: python3 tests/backup_ci_checkouts.py --binary "$ROOTYARD_BIN" --legacy-binary target/rootyard-schema007 --report test-results/backup-ci-checkouts.json
      - name: Exercise source-pin paired backup and restore
        run: python3 tests/backup_ci_pins.py --binary "$ROOTYARD_BIN" --report test-results/backup-ci-pins.json
      - name: Exercise durable push recovery
        run: python3 tests/reliability.py --binary "$ROOTYARD_BIN" --report test-results/reliability.json
      - name: Exercise direct collaborator Git transport and write-endpoint authorization (#4)
        timeout-minutes: 15
        run: python3 tests/collaborator_transport.py --binary "$ROOTYARD_BIN" --report test-results/collaborator-transport.json
      - name: Recover native Git receipts after collaborator and organization withdrawal
        run: python3 tests/recorded_membership_recovery.py --binary "$ROOTYARD_BIN" --report test-results/recorded-membership-recovery.json
      - name: Recover native Git receipts after token revocation
