name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: rust:1-trixie
      # Match compose.yaml: orphaned Git grandchildren need an init reaper.
      options: --init
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_PASSWORD: rootyard-ci-only
          POSTGRES_DB: rootyard_test
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard:rootyard-ci-only@postgres:5432/rootyard_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.99.1 gate tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc -V && cargo -V && rustfmt -V && cargo clippy -V
      - name: Install matching PostgreSQL client and test tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends git python3 python3-venv postgresql-17 postgresql-client-17 redis-server gcc g++ make pkg-config openjdk-21-jre-headless curl ca-certificates openssl
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "PG_SHARE=/usr/share/postgresql/17" >> "$GITHUB_ENV"
      - name: Test bounded Kafka download helper
        run: python3 -m unittest discover -s tests -p 'test_download_ci_kafka.py'
      - name: Prepare verified isolated Kafka distribution
        timeout-minutes: 5
        run: |
          python3 scripts/download_ci_kafka.py test-results/ci-tools/rootyard-kafka.tgz
          tar -xzf test-results/ci-tools/rootyard-kafka.tgz -C test-results/ci-tools
      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          git --version
          python3 --version
          psql --version
          pg_dump --version
          initdb --version
          pg_ctl --version
          redis-server --version
          java -version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features pando-lab -- -D warnings
      - run: cargo test --locked --all-targets --features pando-lab
      - name: Verify durable PostgreSQL workers
        run: cargo test --locked --features pando-lab --test outbox --test resolution_fences -- --ignored
      - run: python3 scripts/build_native.py --features pando-lab --bins
      - run: cargo build --locked --bin rootyard-view-lab
      - name: Verify design documentation integrity
        run: python3 scripts/check_design_docs.py
      - name: Verify schema-030 catalog and dump round trip
        run: python3 tests/schema_contract.py --binary target/debug/rootyard
      - name: Verify end-to-end harness synchronization
        run: python3 -m unittest discover -s tests -p 'test_e2e_sync.py'
      - name: Reject missing executables and non-server stubs
        run: python3 -m unittest discover -s tests -p 'test_native_entrypoint.py'
      - name: Prepare pinned independent Git clients
        run: |
          python3 scripts/prepare_git_clients.py test-results/ci-tools/clients
          python3 -m venv test-results/ci-tools/client-venv
          test-results/ci-tools/client-venv/bin/pip install pygit2==1.19.0 cffi==2.1.1 pycparser==3.12
      - name: Exercise stock Git, JGit and libgit2 against the Rust service
        run: |
          ROOTYARD_JGIT_CLASSPATH="$PWD/test-results/ci-tools/clients/jgit-libs/*" ROOTYARD_PYGIT2_PYTHON="$PWD/test-results/ci-tools/client-venv/bin/python" python3 tests/client_compatibility.py --binary target/debug/rootyard --report test-results/client-compatibility.json
      - name: Verify parallel track and schema baseline boundaries
        run: python3 -m unittest discover -s tests -p 'test_parallel_boundaries.py'
      - name: Run all Python unit and Tier-5 adversarial contract suites
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise native Git end to end
        run: python3 tests/e2e.py --binary target/debug/rootyard --report test-results/e2e.json
      - name: Exercise exact-commit CI read mirror
        run: python3 tests/ci_mirror.py --binary target/debug/rootyard --report test-results/ci-mirror.json
      - name: Exercise exact-target source retention and mirror preparation
        run: python3 tests/ci_source_pins.py --binary target/debug/rootyard --report test-results/ci-source-pins.json
      - name: Exercise isolated job checkout authorization and object closure
        run: python3 tests/ci_job_checkouts.py --binary target/debug/rootyard --report test-results/ci-job-checkouts.json
      - name: Build frozen schema007 binary for genuine legacy restore
        run: |
          legacy=08b10e9976c012343c48e4fd6a5981e0266b8c53
          workspace="$PWD"
          umask 077
          mkdir -p "$workspace/target"
          legacy_root=$(mktemp -d "$workspace/target/legacy-source.XXXXXX")
          trap 'rm -rf "$legacy_root"' EXIT
          mkdir "$legacy_root/home" "$legacy_root/repo"
          # Never invoke Git against the inherited checkout or inherit its config.
          git_owned() {
            env -i PATH="$PATH" HOME="$legacy_root/home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_TERMINAL_PROMPT=0 timeout 180 git -C "$legacy_root/repo" "$@"
          }
          git_owned init --template=
          git_owned fetch --no-tags --depth=1 https://github.com/jihuayu/rootyard.git "$legacy"
          test "$(git_owned rev-parse --verify 'FETCH_HEAD^{commit}')" = "$legacy"
          git_owned checkout --detach "$legacy"
          test "$(git_owned rev-parse --verify HEAD)" = "$legacy"
          (
            cd "$legacy_root/repo"
            CARGO_TARGET_DIR="$workspace/target/legacy-build" cargo build --locked --manifest-path Cargo.toml --bin rootyard
          )
          cp "$workspace/target/legacy-build/debug/rootyard" "$workspace/target/rootyard-schema007"
      - name: Exercise checkout backup revocation and genuine schema007 restore
        run: python3 tests/backup_ci_checkouts.py --binary target/debug/rootyard --legacy-binary target/rootyard-schema007 --report test-results/backup-ci-checkouts.json
      - name: Exercise source-pin paired backup and restore
        run: python3 tests/backup_ci_pins.py --binary target/debug/rootyard --report test-results/backup-ci-pins.json
      - name: Exercise durable push recovery
        run: python3 tests/reliability.py --binary target/debug/rootyard --report test-results/reliability.json
      - name: Exercise offline backup and fresh database restore
        run: python3 tests/backup.py --binary target/debug/rootyard --report test-results/backup.json
      - name: Exercise restored schema-003 recovery protections
        run: python3 tests/backup_recovery.py --binary target/debug/rootyard --report test-results/backup-recovery.json
      - name: Exercise independent workers after fresh restore
        run: python3 tests/restored_workers.py --binary target/debug/rootyard --report test-results/restored-workers.json
      - name: Exercise explicit recovery and metrics
        run: |
          python3 tests/recovery_ops.py --binary target/debug/rootyard --report test-results/recovery-ops.json
          python3 tests/metrics.py --binary target/debug/rootyard --report test-results/metrics.json
      - name: Exercise cross-process delivery
        run: ROOTYARD_TEST_REDIS_SERVER=/usr/bin/redis-server python3 tests/cross_process.py --binary target/debug/rootyard --report test-results/cross-process.json
      - name: Exercise real Kafka advisory wakes
        run: ROOTYARD_TEST_KAFKA_HOME="$GITHUB_WORKSPACE/test-results/ci-tools/kafka_2.13-4.4.0" python3 tests/kafka_wakes.py --binary target/debug/rootyard --report test-results/kafka.json
      - name: Exercise restored legacy upgrade backup
        run: python3 tests/backup_upgrade.py --binary target/debug/rootyard --report test-results/backup-upgrade.json
      - name: Exercise populated Forge backup and fresh restore
        run: python3 tests/backup_forge.py --binary target/debug/rootyard --report test-results/backup-forge.json
      - name: Exercise private-owner Issue and comment API
        run: python3 tests/forge.py --binary target/debug/rootyard --report test-results/forge.json
      - name: Exercise durable Issue and comment creation retries
        run: python3 tests/forge_idempotency.py --binary target/debug/rootyard --report test-results/forge-idempotency.json
      - name: Exercise Issue state-filter keyset lists
        run: python3 tests/forge_state_filter.py --binary target/debug/rootyard --report test-results/forge-state-filter.json
      - name: Exercise Pull Request, Review, Check Run, Branch Rule, and Atomic Merge API
        run: python3 tests/pulls.py --binary target/debug/rootyard --report test-results/pulls.json
      - name: Exercise populated Pull Request paired backup and fresh restore
        run: python3 tests/backup_pulls.py --binary target/debug/rootyard --report test-results/backup-pulls.json
      - name: Exercise repository read-only Browse API and atomic multi-ref CAS transactions
        run: python3 tests/browse.py --binary target/debug/rootyard --report test-results/browse.json
      - name: Exercise Git LFS Batch API, streaming object storage, and paired backup
        run: python3 tests/lfs.py --binary target/debug/rootyard --report test-results/lfs.json
      - name: Exercise local workspace semantics
        run: python3 tests/workspaces.py --binary target/debug/rootyard-workspace-lab --report test-results/workspaces.json
      - name: Exercise workspace incremental sync, ignore rules, and read-only views
        run: python3 tests/workspace.py --binary target/debug/rootyard-workspace-lab --report test-results/workspace.json
      - name: Exercise Namespace, Git View and cross-repository ChangeSet semantics
        run: python3 tests/git_views.py --binary target/debug/rootyard-view-lab --report test-results/git-views.json
      - name: Exercise Pando object store delta resolution, graph traversal, and differential export
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE" && runuser -u postgres -- env PATH="/usr/lib/postgresql/17/bin:$PATH" PG_SHARE="/usr/share/postgresql/17" python3 tests/pando_lab.py --binary target/debug/rootyard-pando-lab
          mkdir -p test-results
          latest_pando=$(ls -td /tmp/rootyard-pando-lab-* 2>/dev/null | head -1 || true)
          if [ -n "$latest_pando" ] && [ -f "$latest_pando/results.json" ]; then
            cp "$latest_pando/results.json" test-results/pando-lab.json
          fi
      - name: Exercise external CI webhooks, HMAC-SHA256 delivery, and auto PR CI pins
        run: python3 tests/webhooks.py --binary target/debug/rootyard --report test-results/webhooks.json
      - name: Exercise webhook batching, lease and TLS regressions
        timeout-minutes: 10
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: |
          set -euo pipefail
          mkdir -p test-results
          python3 tests/ci_webhook_regressions.py --binary target/debug/rootyard 2>&1 | tee test-results/ci-webhook-regressions.log
      - name: Exercise durable webhook worker recovery against real PostgreSQL
        timeout-minutes: 15
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: python3 tests/webhook_worker_recovery.py --binary target/debug/rootyard --report test-results/webhook-worker-recovery.json
      - name: Exercise repository collaborators, teams, 5-role RBAC, and audit log
        run: python3 tests/members.py --binary target/debug/rootyard --report test-results/members.json
      - name: Exercise server-side HTML Web UI views, XSS sanitization, and PR/Issue workflows
        run: python3 tests/web.py --binary target/debug/rootyard --report test-results/web.json
      - name: Exercise real browser sessions, CSRF, expiry and revocation
        timeout-minutes: 10
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: python3 tests/web_sessions.py --binary target/debug/rootyard --report test-results/web-sessions.json
      - name: Exercise multi-node repository sharding, epoch write fencing, and automated failover
        run: python3 tests/sharding.py --binary target/debug/rootyard --report test-results/sharding.json
      - name: Exercise multi-node 1/2/4-node concurrency and P95/P99 sharding benchmark suite
        run: python3 tests/benchmark_tiers.py --binary target/debug/rootyard --report test-results/benchmark-tiers.json
      - name: Exercise explicitly labeled 4-tier reference models
        run: ROOTYARD_E2E_REQUIRE_M5=1 ROOTYARD_E2E_REQUIRE_P2=1 ROOTYARD_E2E_REQUIRE_P3=1 python3 tests/e2e_tiers.py --reference-only --tier all --report test-results/reference-tiers.json
      - name: Bind native regressions to the built binary and source inputs
        run: |
          python3 scripts/native_report_manifest.py --mode job \
            --manifest-out test-results/native-pr-gate.json \
            --build-receipt target/debug/rootyard.build.json \
            --binary target/debug/rootyard \
            --report web_sessions=test-results/web-sessions.json \
            --report webhook_worker_recovery=test-results/webhook-worker-recovery.json \
            --log webhook_regressions=test-results/ci-webhook-regressions.log \
            --log-marker "webhook_regressions=201 event batches: passed" \
            --log-marker "webhook_regressions=concurrent claim fence: passed" \
            --log-marker "webhook_regressions=verified TLS and plaintext rejection: passed" \
            --log-marker "webhook_regressions=untrusted certificate rejected:" \
            --harness tests/web_sessions.py \
            --harness tests/webhook_worker_recovery.py \
            --harness tests/ci_webhook_regressions.py \
            --fixture postgres=postgres:17 \
            --fixture rust="$(rustc -V)"
      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/*.json
            test-results/ci-webhook-regressions.log
            test-results/evidence/*.jsonl
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable image with embedded schema contracts
        run: docker build --tag rootyard:ci .
      - name: Verify unprivileged executable and maintenance clients
        run: |
          test "$(docker run --rm rootyard:ci --rootyard-hook-self-check)" = rootyard-hook-v1
          docker run --rm --entrypoint pg_dump rootyard:ci --version | grep 'PostgreSQL) 17\.'
          docker run --rm --entrypoint pg_restore rootyard:ci --version | grep 'PostgreSQL) 17\.'
          docker run --rm --entrypoint git rootyard:ci --version
          test "$(docker run --rm --entrypoint id rootyard:ci -u)" = 10001
