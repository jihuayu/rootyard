name: CI
# pull_request is the single full gate for a PR head; an unfiltered `push:`
# ran the same verify/container checks a second time for the same commit
# (e.g. push 42783486160 vs pull_request 42783651096 for PR #191). push is
# limited to main, the only long-lived branch (no release/maintenance branches
# or tags exist), so the post-merge gate on main stays complete. No paths:
# filter, so required checks can never be left permanently pending.
# See docs/acceptance/ci-trigger-dedup-20261110.md.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Plain Ubuntu 22.04 host profile, matching the target on which the manual
    # native-kernel-acceptance workflow passed its 17 assertions. There is no
    # container init process: PID 1 is the runner host's init, which adopts and
    # reaps orphaned Git grandchildren. Do not introduce a global child
    # subreaper or relax AppArmor/LSM policy to compensate for a missing init.
    runs-on: ubuntu-22.04
    # Job cap with bounded headroom for the three populated RefStore/artifact-hold
    # backup drills below: their step caps grow from 5 to 10 minutes each, so the
    # worst case added here is 3 x 5 = 15 minutes. Keep this bounded; raising it
    # further must not be used to hide a regression inside one individual step.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootyard
          POSTGRES_PASSWORD: rootyard-ci-only
          POSTGRES_DB: rootyard_test
        # Publish the service on the host at a fixed loopback port. The
        # container service itself is ephemeral and uses a CI-only password.
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U rootyard -d rootyard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOTYARD_TEST_DATABASE_URL: postgresql://rootyard:rootyard-ci-only@127.0.0.1:55432/rootyard_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the project Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CI toolchain (postgresql-17 postgresql-client-17, Git 2.43, bubblewrap --size, FUSE, LFS)
        timeout-minutes: 20
        run: |
          scripts/install_ci_native_tools.sh install \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/ci-native-tools/provenance.json
      - name: Verify native CI tool profile
        timeout-minutes: 5
        run: |
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "PG_SHARE=/usr/share/postgresql/17" >> "$GITHUB_ENV"
          scripts/install_ci_native_tools.sh preflight \
            --prefix "$RUNNER_TEMP/rootyard-ci-native" \
            --provenance test-results/ci-native-tools/provenance.json
      - name: Install pinned Rust 1.99.1 gate tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc -V && cargo -V && rustfmt -V && cargo clippy -V
      - name: Test bounded Kafka download helper
        run: python3 -m unittest discover -s tests -p 'test_download_ci_kafka.py'
      - name: Prepare verified isolated Kafka distribution
        timeout-minutes: 5
        run: |
          python3 scripts/download_ci_kafka.py test-results/ci-tools/rootyard-kafka.tgz
          tar -xzf test-results/ci-tools/rootyard-kafka.tgz -C test-results/ci-tools
      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          git --version
          git lfs version
          bwrap --version
          unshare --version
          fusermount3 --version
          python3 --version
          psql --version
          pg_dump --version
          initdb --version
          pg_ctl --version
          redis-server --version
          java -version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features pando-lab -- -D warnings
      - run: cargo test --locked --all-targets --features pando-lab
      - name: Verify durable PostgreSQL workers
        run: cargo test --locked --features pando-lab --test outbox --test resolution_fences -- --ignored
      - name: Verify PostgreSQL RefStore registry and metadata-core contracts
        timeout-minutes: 5
        run: cargo test --locked --features pando-lab --test ref_store_operations --test ref_store_core --test ref_store_core_snapshot --test ref_store_artifact_holds -- --ignored --test-threads=1
      - name: Build native bins and RefStore fixtures in one batch
        timeout-minutes: 10
        run: |
          python3 scripts/build_native_batch.py \
            --all-bins \
            --features pando-lab \
            --strip-debuginfo \
            --test ref_store_snapshot_backup_fixture \
            --output test-results/refstore-snapshot-fixture \
            --test ref_store_holds_backup_fixture \
            --output test-results/refstore-holds-fixture \
            --manifest-out test-results/native-build-batch.json
      - name: Verify design documentation integrity
        run: python3 scripts/check_design_docs.py
      - name: Verify schema-030 catalog and dump round trip
        run: python3 tests/schema_contract.py --binary target/debug/rootyard
      - name: Verify end-to-end harness synchronization
        run: python3 -m unittest discover -s tests -p 'test_e2e_sync.py'
      - name: Reject missing executables and non-server stubs
        run: python3 -m unittest discover -s tests -p 'test_native_entrypoint.py'
      - name: Prepare pinned independent Git clients
        run: |
          python3 scripts/prepare_git_clients.py test-results/ci-tools/clients
          python3 -m venv test-results/ci-tools/client-venv
          test-results/ci-tools/client-venv/bin/pip install pygit2==1.19.0 cffi==2.1.1 pycparser==3.12
      - name: Exercise stock Git, JGit and libgit2 against the Rust service
        run: |
          ROOTYARD_JGIT_CLASSPATH="$PWD/test-results/ci-tools/clients/jgit-libs/*" ROOTYARD_PYGIT2_PYTHON="$PWD/test-results/ci-tools/client-venv/bin/python" python3 tests/client_compatibility.py --binary target/debug/rootyard --report test-results/client-compatibility.json
      - name: Verify parallel track and schema baseline boundaries
        run: python3 -m unittest discover -s tests -p 'test_parallel_boundaries.py'
      - name: Run all Python unit and Tier-5 adversarial contract suites
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise native Git end to end
        run: python3 tests/e2e.py --binary target/debug/rootyard --report test-results/e2e.json
      - name: Exercise exact-commit CI read mirror
        run: python3 tests/ci_mirror.py --binary target/debug/rootyard --report test-results/ci-mirror.json
      - name: Exercise exact-target source retention and mirror preparation
        run: python3 tests/ci_source_pins.py --binary target/debug/rootyard --report test-results/ci-source-pins.json
      - name: Exercise isolated job checkout authorization and object closure
        run: python3 tests/ci_job_checkouts.py --binary target/debug/rootyard --report test-results/ci-job-checkouts.json
      - name: Exercise exact pinned dependency checkout and origin fallback boundaries
        timeout-minutes: 20
        run: python3 tests/ci_dependencies.py --binary target/debug/rootyard --report test-results/ci-dependencies.json
      - name: Build frozen schema007 binary for genuine legacy restore
        run: |
          legacy=08b10e9976c012343c48e4fd6a5981e0266b8c53
          workspace="$PWD"
          umask 077
          mkdir -p "$workspace/target"
          legacy_root=$(mktemp -d "$workspace/target/legacy-source.XXXXXX")
          trap 'rm -rf "$legacy_root"' EXIT
          mkdir "$legacy_root/home" "$legacy_root/repo"
          # Never invoke Git against the inherited checkout or inherit its config.
          git_owned() {
            env -i PATH="$PATH" HOME="$legacy_root/home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_TERMINAL_PROMPT=0 timeout 180 git -C "$legacy_root/repo" "$@"
          }
          git_owned init --template=
          git_owned fetch --no-tags --depth=1 https://github.com/jihuayu/rootyard.git "$legacy"
          test "$(git_owned rev-parse --verify 'FETCH_HEAD^{commit}')" = "$legacy"
          git_owned checkout --detach "$legacy"
          test "$(git_owned rev-parse --verify HEAD)" = "$legacy"
          (
            cd "$legacy_root/repo"
            CARGO_TARGET_DIR="$workspace/target/legacy-build" cargo build --locked --manifest-path Cargo.toml --bin rootyard
          )
          cp "$workspace/target/legacy-build/debug/rootyard" "$workspace/target/rootyard-schema007"
      - name: Exercise checkout backup revocation and genuine schema007 restore
        run: python3 tests/backup_ci_checkouts.py --binary target/debug/rootyard --legacy-binary target/rootyard-schema007 --report test-results/backup-ci-checkouts.json
      - name: Exercise source-pin paired backup and restore
        run: python3 tests/backup_ci_pins.py --binary target/debug/rootyard --report test-results/backup-ci-pins.json
      - name: Exercise durable push recovery
        run: python3 tests/reliability.py --binary target/debug/rootyard --report test-results/reliability.json
      - name: Exercise direct collaborator Git transport and write-endpoint authorization (#4)
        timeout-minutes: 15
        run: python3 tests/collaborator_transport.py --binary target/debug/rootyard --report test-results/collaborator-transport.json
      - name: Recover native Git receipts after collaborator and organization withdrawal
        run: python3 tests/recorded_membership_recovery.py --binary target/debug/rootyard --report test-results/recorded-membership-recovery.json
      - name: Recover native Git receipts after token revocation
        run: python3 tests/recorded_recovery.py --binary target/debug/rootyard --report test-results/recorded-recovery.json
      - name: Exercise offline backup and fresh database restore
        run: python3 tests/backup.py --binary target/debug/rootyard --report test-results/backup.json
      # Kept beside (not in place of) tests/backup.py: this drill covers the
      # audit-ID sequence across a format21 metadata-only backup and a fresh
      # database restore. It reuses the job's PostgreSQL 17 service URL, the
      # source-bound binary and the job fixture env, and fails (never skips)
      # when a dependency is missing; the report feeds the native manifest.
      - name: Restore the audit ID sequence through an offline backup and fresh database
        timeout-minutes: 10
        run: python3 tests/backup_audit_sequence_legacy.py --binary target/debug/rootyard --report test-results/audit-sequence-backup.json
      - name: Restore populated PostgreSQL RefStore core metadata from the current backup format
        timeout-minutes: 10
        run: python3 tests/backup_refstore_core139.py --binary target/debug/rootyard --report test-results/backup-refstore-core.json
      - name: Restore populated PostgreSQL RefStore snapshot metadata from the current backup format
        timeout-minutes: 10
        run: python3 tests/backup_refstore_snapshot140.py --binary target/debug/rootyard --snapshot-fixture-binary test-results/refstore-snapshot-fixture --report test-results/backup-refstore-snapshot.json
      - name: Restore populated permanent artifact-hold metadata from the current backup format
        timeout-minutes: 10
        run: python3 tests/backup_refstore_holds141.py --binary target/debug/rootyard --holds-fixture-binary test-results/refstore-holds-fixture --report test-results/backup-refstore-holds.json
      - name: Exercise restored schema-003 recovery protections
        run: python3 tests/backup_recovery.py --binary target/debug/rootyard --report test-results/backup-recovery.json
      - name: Exercise independent workers after fresh restore
        run: python3 tests/restored_workers.py --binary target/debug/rootyard --report test-results/restored-workers.json
      - name: Exercise explicit recovery and metrics
        run: |
          python3 tests/recovery_ops.py --binary target/debug/rootyard --report test-results/recovery-ops.json
          python3 tests/metrics.py --binary target/debug/rootyard --report test-results/metrics.json
      - name: Exercise cross-process delivery
        run: ROOTYARD_TEST_REDIS_SERVER=/usr/bin/redis-server python3 tests/cross_process.py --binary target/debug/rootyard --report test-results/cross-process.json
      - name: Exercise real Kafka advisory wakes
        run: ROOTYARD_TEST_KAFKA_HOME="$GITHUB_WORKSPACE/test-results/ci-tools/kafka_2.13-4.4.0" python3 tests/kafka_wakes.py --binary target/debug/rootyard --report test-results/kafka.json
      - name: Exercise restored legacy upgrade backup
        run: python3 tests/backup_upgrade.py --binary target/debug/rootyard --report test-results/backup-upgrade.json
      - name: Exercise populated Forge backup and fresh restore
        run: python3 tests/backup_forge.py --binary target/debug/rootyard --report test-results/backup-forge.json
      - name: Exercise private-owner Issue and comment API
        run: python3 tests/forge.py --binary target/debug/rootyard --report test-results/forge.json
      - name: Exercise durable Issue and comment creation retries
        run: python3 tests/forge_idempotency.py --binary target/debug/rootyard --report test-results/forge-idempotency.json
      - name: Exercise Issue state-filter keyset lists
        run: python3 tests/forge_state_filter.py --binary target/debug/rootyard --report test-results/forge-state-filter.json
      - name: Exercise Pull Request, Review, Check Run, Branch Rule, and Atomic Merge API
        run: python3 tests/pulls.py --binary target/debug/rootyard --report test-results/pulls.json
      - name: Exercise populated Pull Request paired backup and fresh restore
        run: python3 tests/backup_pulls.py --binary target/debug/rootyard --report test-results/backup-pulls.json
      - name: Exercise repository read-only Browse API and atomic multi-ref CAS transactions
        run: python3 tests/browse.py --mixed-refs --git "$(command -v git)" --binary target/debug/rootyard --report test-results/browse.json
      - name: Exercise repository pagination against real PostgreSQL
        timeout-minutes: 10
        run: python3 tests/repository_pagination.py --binary target/debug/rootyard --report test-results/repository-pagination.json
      - name: Exercise Git LFS Batch API, streaming object storage, and paired backup
        run: python3 tests/lfs.py --binary target/debug/rootyard --report test-results/lfs.json
      - name: Exercise local workspace semantics
        run: python3 tests/workspaces.py --binary target/debug/rootyard-workspace-lab --report test-results/workspaces.json
      - name: Exercise workspace incremental sync, ignore rules, and read-only views
        run: python3 tests/workspace.py --binary target/debug/rootyard-workspace-lab --report test-results/workspace.json
      - name: Exercise native workspace autocapture acceptance
        timeout-minutes: 20
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
          ROOTYARD_WORKSPACE_MOUNT_MODE: direct
        run: python3 tests/workspace_capture_acceptance.py --binary target/debug/rootyard --report test-results/workspace-capture.json
      - name: Exercise Namespace, Git View and cross-repository ChangeSet semantics
        run: python3 tests/git_views.py --binary target/debug/rootyard-view-lab --report test-results/git-views.json
      - name: Exercise Pando object store delta resolution, graph traversal, and differential export
        run: |
          test "$(id -u)" -ne 0
          python3 tests/pando_lab.py --binary target/debug/rootyard-pando-lab
          mkdir -p test-results
          latest_pando=$(ls -td /tmp/rootyard-pando-lab-* 2>/dev/null | head -1 || true)
          test -n "$latest_pando"
          test -f "$latest_pando/results.json"
          cp "$latest_pando/results.json" test-results/pando-lab.json
      - name: Exercise external CI webhooks, HMAC-SHA256 delivery, and auto PR CI pins
        run: python3 tests/webhooks.py --binary target/debug/rootyard --report test-results/webhooks.json
      - name: Exercise webhook batching, lease and TLS regressions
        timeout-minutes: 10
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: |
          set -euo pipefail
          mkdir -p test-results
          python3 tests/ci_webhook_regressions.py --binary target/debug/rootyard 2>&1 | tee test-results/ci-webhook-regressions.log
      - name: Exercise durable webhook worker recovery against real PostgreSQL
        timeout-minutes: 15
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: python3 tests/webhook_worker_recovery.py --binary target/debug/rootyard --report test-results/webhook-worker-recovery.json
      - name: Exercise webhook fairness
        timeout-minutes: 20
        run: python3 tests/webhook_fairness.py --binary target/debug/rootyard --report test-results/webhook-fairness.json
      - name: Exercise webhook delivery sequence allocation and cursor pagination
        timeout-minutes: 5
        run: python3 tests/webhook_pagination.py --binary target/debug/rootyard --report test-results/webhook-pagination.json
      - name: Exercise no-hook Pull Request ref reconciliation
        timeout-minutes: 10
        run: python3 tests/webhook_pr_sync.py --binary target/debug/rootyard --report test-results/webhook-pr-sync.json
      - name: Exercise repository collaborators, teams, 5-role RBAC, and audit log
        run: python3 tests/members.py --binary target/debug/rootyard --report test-results/members.json
      - name: Exercise organization and member pagination against real PostgreSQL
        timeout-minutes: 10
        run: python3 tests/organization_pagination.py --binary target/debug/rootyard --report test-results/organization-pagination.json
      - name: Exercise server-side HTML Web UI views, XSS sanitization, and PR/Issue workflows
        run: python3 tests/web.py --binary target/debug/rootyard --report test-results/web.json
      - name: Exercise web detail pagination against real PostgreSQL
        timeout-minutes: 10
        run: python3 tests/web_detail_pagination.py --binary target/debug/rootyard --report test-results/web-detail-pagination.json
      - name: Exercise browser repository-discovery pagination against real PostgreSQL
        timeout-minutes: 5
        run: python3 tests/web_repository_pagination.py --binary target/debug/rootyard --report test-results/web-repository-pagination.json
      - name: Exercise real browser sessions, CSRF, expiry and revocation
        timeout-minutes: 10
        env:
          ROOTYARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/test-results/evidence
        run: python3 tests/web_sessions.py --binary target/debug/rootyard --report test-results/web-sessions.json
      - name: Exercise structured worker-operation diagnostics isolation
        timeout-minutes: 5
        run: python3 tests/worker_diagnostics.py --binary target/debug/rootyard --report test-results/worker-diagnostics.json
      - name: Exercise sharded control-plane placement, lease/epoch fencing, and explicit refusal of unmeasured failover, rebalance and DR
        run: python3 tests/sharding.py --binary target/debug/rootyard --report test-results/sharding.json
      - name: Exercise shard marker transition crash/rollback and restart reconciliation
        timeout-minutes: 20
        run: python3 tests/cluster_migration_phases_native.py --binary target/debug/rootyard --transitions-only --report test-results/shard-marker-transitions.json
      - name: Exercise labelled simulation-only 1/2/4-node sharding benchmark metadata receipts
        run: python3 tests/benchmark_tiers.py --binary target/debug/rootyard --report test-results/benchmark-tiers.json
      - name: Exercise explicitly labeled 4-tier reference models
        run: ROOTYARD_E2E_REQUIRE_M5=1 ROOTYARD_E2E_REQUIRE_P2=1 ROOTYARD_E2E_REQUIRE_P3=1 python3 tests/e2e_tiers.py --reference-only --tier all --report test-results/reference-tiers.json
      - name: Bind native regressions to the built binary and source inputs
        run: |
          python3 scripts/native_report_manifest.py --mode job \
            --manifest-out test-results/native-pr-gate.json \
            --build-receipt target/debug/rootyard.build.json \
            --binary target/debug/rootyard \
            --report web_sessions=test-results/web-sessions.json \
            --report metrics=test-results/metrics.json \
            --report webhook_worker_recovery=test-results/webhook-worker-recovery.json \
            --report webhook_fairness=test-results/webhook-fairness.json \
            --report webhook_pagination=test-results/webhook-pagination.json \
            --report webhook_pr_sync=test-results/webhook-pr-sync.json \
            --report audit_sequence_backup=test-results/audit-sequence-backup.json \
            --report workspace_capture=test-results/workspace-capture.json \
            --report repository_pagination=test-results/repository-pagination.json \
            --report organization_pagination=test-results/organization-pagination.json \
            --report web_detail_pagination=test-results/web-detail-pagination.json \
            --report web_repository_pagination=test-results/web-repository-pagination.json \
            --report worker_diagnostics=test-results/worker-diagnostics.json \
            --report webhooks=test-results/webhooks.json \
            --report browse=test-results/browse.json \
            --report ci_mirror=test-results/ci-mirror.json \
            --report ci_source_pins=test-results/ci-source-pins.json \
            --report ci_job_checkouts=test-results/ci-job-checkouts.json \
            --report ci_dependencies=test-results/ci-dependencies.json \
            --report shard_marker_transitions=test-results/shard-marker-transitions.json \
            --require-case shard_marker_transitions=takeover-after-source-marker \
            --require-case shard_marker_transitions=fence-audit-rollback \
            --require-case shard_marker_transitions=fence-transition-before-commit \
            --require-case shard_marker_transitions=fence-cutover-after-commit \
            --require-case shard_marker_transitions=unfence-audit-rollback \
            --require-case shard_marker_transitions=unfence-transition-before-commit \
            --require-case shard_marker_transitions=unfence-cutover-after-commit \
            --require-case shard_marker_transitions=degrade-audit-rollback \
            --require-case shard_marker_transitions=degrade-transition-before-commit \
            --require-case shard_marker_transitions=degrade-cutover-after-commit \
            --require-case shard_marker_transitions=recover-audit-rollback \
            --require-case shard_marker_transitions=recover-transition-before-commit \
            --require-case shard_marker_transitions=recover-cutover-after-commit \
            --log webhook_regressions=test-results/ci-webhook-regressions.log \
            --log-marker "webhook_regressions=201 event batches: passed" \
            --log-marker "webhook_regressions=concurrent claim fence: passed" \
            --log-marker "webhook_regressions=verified TLS and plaintext rejection: passed" \
            --log-marker "webhook_regressions=untrusted certificate rejected:" \
            --harness tests/web_sessions.py \
            --harness tests/ci_dependencies.py \
            --harness tests/ci_job_checkouts.py \
            --harness tests/ci_source_pins.py \
            --harness tests/ci_mirror.py \
            --harness tests/metrics.py \
            --harness tests/webhook_worker_recovery.py \
            --harness tests/webhook_fairness.py \
            --harness tests/pulls.py \
            --harness tests/forge.py \
            --harness tests/e2e.py \
            --harness tests/schema_baseline.py \
            --harness tests/native_evidence.py \
            --harness tests/owned_fuse_cleanup.py \
            --harness tests/ci_webhook_regressions.py \
            --harness tests/backup_audit_sequence_legacy.py \
            --harness tests/workspace_capture_acceptance.py \
            --harness tests/fixtures/capture_read_gate.c \
            --harness tests/repository_pagination.py \
            --harness tests/organization_pagination.py \
            --harness tests/web_detail_pagination.py \
            --harness tests/web_repository_pagination.py \
            --harness tests/worker_diagnostics.py \
            --harness tests/webhooks.py \
            --harness tests/webhook_pagination.py \
            --harness tests/webhook_pr_sync.py \
            --harness tests/cluster_migration_phases_native.py \
            --harness tests/webhook_tenant_matrix.py \
            --harness tests/browse.py \
            --harness tests/browse_ref_scale.py \
            --harness tests/mixed_ref_cases.py \
            --harness tests/mixed_ref_support.py \
            --harness tests/refusal_audit_sql.py \
            --harness scripts/build_native.py \
            --fixture postgres=postgres:17 \
            --fixture workspace_mount_mode=direct \
            --require-case workspace_capture=__main__.WorkspaceCaptureAcceptance.test_capture_reaches_ids_beyond_fixed_prefix \
            --require-case workspace_capture=__main__.WorkspaceCaptureAcceptance.test_api_write_baseline_does_not_emit_spurious_capture \
            --require-case workspace_capture=__main__.WorkspaceCaptureAcceptance.test_large_inventory_keeps_single_tokio_worker_responsive \
            --require-case workspace_capture=__main__.WorkspaceCaptureAcceptance.test_scan_does_not_hold_row_lock_and_rejects_stale_revision \
            --require-case workspace_capture=__main__.WorkspaceCaptureAcceptance.test_scan_revalidates_lease_epoch_before_committing \
            --require-case browse=protected_writes_and_ref_ack_failure \
            --require-case browse=ref_transaction_settlement_recovery \
            --require-case browse=ref_transaction_crash_recovery \
            --require-case browse=ref_scale_complete_traversal \
            --require-case browse=mixed_protected_unprotected_atomic_push \
            --require-case browse=mixed_protected_unprotected_ref_transaction \
            --require-case ci_mirror=sync_and_pinned_clone \
            --require-case ci_source_pins=source_retention_before_first_sync \
            --require-case ci_job_checkouts=setup_checkout \
            --require-case ci_dependencies=missing_or_corrupt_dependency_blocks_ready \
            --require-case ci_dependencies=prepared_mirror_nested_lfs_checkout \
            --require-case ci_dependencies=unauthorized_dependency_source_is_rejected \
            --require-case ci_dependencies=dependency_credentials_are_scope_bound \
            --require-case ci_dependencies=moved_submodule_branch_keeps_pinned_gitlink \
            --require-case ci_dependencies=cancellation_revokes_all_dependency_credentials \
            --require-case ci_dependencies=integration_claim_prepares_exact_dependencies \
            --require-case ci_dependencies=origin_fallback_dependency_credential_boundaries \
            --require-case ci_dependencies=unsafe_gitmodules_url_receives_no_credentials \
            --fixture rust="$(rustc -V)" \
            --fixture git="$(git --version)" \
            --fixture git_lfs="$(git lfs version)" \
            --fixture bubblewrap="$(bwrap --version)" \
            --fixture fuse_device="$(stat -Lc '%F mode=%a' /dev/fuse)" \
            --fixture ci_native_tools_provenance_sha256="$(sha256sum test-results/ci-native-tools/provenance.json | awk '{print $1}')"
      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/*.json
            target/debug/rootyard.build.json
            test-results/ci-webhook-regressions.log
            test-results/evidence/*.jsonl
            test-results/*-evidence/*.jsonl
            test-results/ci-native-tools/provenance.json
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable image with embedded schema contracts
        run: docker build --tag rootyard:ci .
      - name: Verify unprivileged executable and maintenance clients
        run: |
          test "$(docker run --rm rootyard:ci --rootyard-hook-self-check)" = rootyard-hook-v1
          docker run --rm --entrypoint pg_dump rootyard:ci --version | grep 'PostgreSQL) 17\.'
          docker run --rm --entrypoint pg_restore rootyard:ci --version | grep 'PostgreSQL) 17\.'
          docker run --rm --entrypoint git rootyard:ci --version
          test "$(docker run --rm --entrypoint id rootyard:ci -u)" = 10001
